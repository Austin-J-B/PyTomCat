<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feeding Schedule | Campus Cat Coalition</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Corben:wght@400;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* --- SITE PALETTE --- */
            --site-bg: #FFF9F3;       /* Cream Header Background */
            --site-text: #414B3B;     /* Dark Olive Text */
            --site-accent: #8CA87C;   /* Sage Accent */
            --site-green-bg: #E8F3E6; /* New Green Background for workspace */
            --white: #FFFFFF;
            
            /* --- FUNCTIONAL COLORS --- */
            --grid-line: #d1d9c0;
            --selection-highlight: rgba(65, 75, 59, 0.2); 
            --focus-ring: #414B3B;
            
            /* --- DIMENSIONS --- */
            --header-height: 80px;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--site-bg);
            color: var(--site-text);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- HEADER --- */
        header.site-header {
            background-color: var(--site-bg);
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid rgba(65, 75, 59, 0.1);
            height: var(--header-height);
            flex-shrink: 0;
            z-index: 50;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            position: relative;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        /* --- HAMBURGER MENU --- */
        .menu-container {
            position: relative;
        }

        .hamburger-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 5px;
        }

        .hamburger-line {
            width: 24px;
            height: 3px;
            background-color: var(--site-text);
            border-radius: 2px;
            transition: 0.2s;
        }

        .hamburger-btn:hover .hamburger-line {
            background-color: var(--site-accent);
        }

        .dropdown-menu {
            position: absolute;
            top: 140%;
            left: 0;
            background: var(--white);
            min-width: 220px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(65, 75, 59, 0.2);
            border: 1px solid var(--grid-line);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.2s ease;
            z-index: 1000;
            overflow: hidden;
        }

        .dropdown-menu.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .menu-item {
            display: block;
            padding: 15px 20px;
            text-decoration: none;
            color: var(--site-text);
            font-weight: 600;
            font-size: 0.95rem;
            transition: background 0.1s;
            border-left: 4px solid transparent;
        }

        .menu-item:hover {
            background-color: var(--site-green-bg);
            border-left-color: var(--site-text);
        }

        .menu-item.active {
            background-color: var(--site-bg);
            color: var(--site-accent);
            cursor: default;
        }

        /* --- TITLE --- */
        a.page-title-link {
            text-decoration: none;
            color: inherit;
        }

        h1.page-title {
            font-family: 'Corben', cursive;
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--site-text);
            margin: 0;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            transition: color 0.2s;
        }
        
        a.page-title-link:hover h1.page-title {
            color: var(--site-accent);
        }

        /* --- CONTROLS --- */
        .controls-area {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .zoom-group {
            display: flex;
            align-items: center;
            background: white;
            border: 1px solid var(--site-text);
            border-radius: 50px;
            padding: 4px 8px;
            gap: 5px;
        }

        .tool-btn {
            background: transparent;
            border: none;
            color: var(--site-text);
            width: 28px; 
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.1s;
        }

        .tool-btn:hover {
            background: var(--site-green-bg);
            color: var(--site-accent);
        }

        .tool-btn.reset-btn {
            font-size: 1rem;
        }

        #zoom-display {
            font-size: 0.8rem;
            font-weight: 600;
            min-width: 40px;
            text-align: center;
            user-select: none;
        }

        /* --- SEARCH --- */
        .search-container {
            position: relative;
            width: 250px;
        }

        input#member-search {
            width: 100%;
            padding: 10px 20px;
            border: 1px solid var(--site-text);
            background: white;
            border-radius: 50px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            color: var(--site-text);
            outline: none;
            transition: all 0.2s ease;
        }

        input#member-search:focus {
            box-shadow: 0 0 0 3px rgba(140, 168, 124, 0.3);
            border-color: var(--site-accent);
        }

        input#member-search::placeholder {
            color: #999;
            font-weight: 400;
            font-style: italic;
        }

        .search-results {
            position: absolute;
            top: 115%;
            left: 0;
            width: 100%;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(65, 75, 59, 0.15);
            overflow: hidden;
            display: none;
            z-index: 200;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid var(--grid-line);
        }

        .result-item {
            padding: 10px 20px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.1s;
        }

        .result-item:hover { background-color: var(--site-green-bg); }
        .result-name { font-weight: 700; font-size: 0.9rem; color: var(--site-text); }
        .result-user { font-size: 0.75rem; color: #888; margin-top: 2px; }

        /* --- SELECTION BADGE --- */
        .current-selection {
            background: var(--site-text);
            color: white;
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 140px;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        .current-selection.empty {
            background: rgba(65, 75, 59, 0.1);
            color: var(--site-text);
            box-shadow: none;
        }

        /* --- WORKSPACE (Grid Area) --- */
        .workspace {
            flex: 1;
            overflow: auto; /* The scrollable area */
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            /* The requested Green Background */
            background-color: var(--site-green-bg); 
            background-image: radial-gradient(rgba(65, 75, 59, 0.05) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        /* Container that gets scaled */
        .sheet-scaler {
            transform-origin: top center;
            transition: transform 0.1s ease-out;
        }

        .sheet-wrapper {
            background: white;
            padding: 10px; 
            border-radius: 8px;
            box-shadow: 0 15px 40px -10px rgba(65, 75, 59, 0.15);
            border: 1px solid var(--white);
        }

        table {
            border-collapse: collapse;
            background: white;
            color: var(--site-text);
            user-select: none;
        }

        /* --- TABLE HEADERS --- */
        th {
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            padding: 18px 10px;
            background-color: var(--white); /* Solid background to cover scroll */
            border-bottom: 3px solid var(--site-text);
            color: var(--site-text);
            
            /* Sticky Magic */
            position: sticky;
            top: 0;
            z-index: 20; /* Higher than rows */
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); /* Adds the "thickness" depth */
        }

        /* Corner Cell */
        th:first-child {
            left: 0;
            z-index: 30; /* Highest z-index */
            background-color: var(--white);
            border-right: 2px solid var(--site-text);
        }

        /* --- ROW HEADERS (Stations) --- */
        .station-cell {
            font-family: 'Corben', cursive; /* Matching site headers */
            font-weight: 700; /* Bolder as requested */
            font-size: 0.95rem;
            padding: 0 20px;
            text-align: left;
            background-color: #F9FBF7;
            border-bottom: 1px solid var(--grid-line);
            border-right: 2px solid var(--site-text);
            
            position: sticky;
            left: 0;
            z-index: 10;
            width: 240px;
        }

        /* --- DATA CELLS --- */
        td.data-cell {
            width: 170px;
            height: 80px;
            border-bottom: 1px solid var(--grid-line);
            border-right: 1px solid var(--grid-line);
            text-align: center;
            vertical-align: middle;
            cursor: pointer;
            position: relative;
            transition: background-color 0.05s;
            line-height: 1.3;
        }

        .cell-content-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        .cell-name {
            font-weight: 700;
            font-size: 0.95rem;
            color: #1a2616;
        }
        
        .cell-username {
            font-weight: 500;
            font-size: 0.7rem;
            color: rgba(0,0,0,0.5);
            margin-top: 2px;
        }

        /* --- INTERACTION STATES --- */
        td.data-cell.focus {
            box-shadow: inset 0 0 0 3px var(--focus-ring);
            z-index: 5;
        }

        td.data-cell.selected {
            background-color: var(--selection-highlight) !important;
        }
        
        /* When assigned, we remove default hover to show color */
        td.data-cell.assigned:hover {
            filter: brightness(0.95);
        }
        td.data-cell:not(.assigned):hover {
            background-color: #f4f4f4;
        }

        /* Loading Overlay */
        #loading {
            position: fixed; inset: 0;
            background: var(--site-bg);
            z-index: 9999;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            color: var(--site-text); font-family: 'Corben', cursive;
            font-size: 1.5rem; gap: 20px;
        }
    </style>
</head>
<body>

    <div id="loading">
        <div>Fetching Schedule...</div>
    </div>

    <header class="site-header">
        <div class="header-left">
            <div class="menu-container">
                <button class="hamburger-btn" onclick="toggleMenu()">
                    <div class="hamburger-line"></div>
                    <div class="hamburger-line"></div>
                    <div class="hamburger-line"></div>
                </button>
                <div id="main-menu" class="dropdown-menu">
                    <a href="#" class="menu-item active">Feeding Schedule</a>
                    </div>
            </div>

            <a href="https://www.catsofuta.org/" class="page-title-link">
                <h1 class="page-title">
                    Campus Cat Coalition
                </h1>
            </a>
        </div>

        <div class="controls-area">
            <div class="zoom-group">
                <button class="tool-btn" onclick="adjustZoom(-0.1)" title="Zoom Out">−</button>
                <div id="zoom-display">100%</div>
                <button class="tool-btn" onclick="adjustZoom(0.1)" title="Zoom In">+</button>
                <button class="tool-btn reset-btn" onclick="resetZoom()" title="Reset View">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                        <path d="M3 3v5h5"/>
                    </svg>
                </button>
            </div>

            <div class="search-container">
                <input type="text" id="member-search" placeholder="Search Volunteer..." autocomplete="off">
                <div id="search-results" class="search-results"></div>
            </div>

            <div id="selection-display" class="current-selection empty">
                Select User
            </div>
        </div>
    </header>

    <div class="workspace" id="workspace">
        <div class="sheet-scaler" id="sheet-scaler">
            <div class="sheet-wrapper" id="sheet-container">
                <table id="schedule-table">
                    <thead>
                        <tr>
                            <th>Station</th>
                            <th>Sunday</th>
                            <th>Monday</th>
                            <th>Tuesday</th>
                            <th>Wednesday</th>
                            <th>Thursday</th>
                            <th>Friday</th>
                            <th>Saturday</th>
                        </tr>
                    </thead>
                    <tbody>
                        </tbody>
                </table>
            </div>
        </div>
    </div>

<script>
// --- CONFIG ---
const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const STATIONS = [
    "Microwave", "Snickers", "Business", "The Greens", "HOP", 
    "Lot 50", "Mary Kay & Zen", "West Hall", "Maintenance"
];

// --- STATE ---
let scheduleData = {};
// Maps "Station|DayIndex" -> { name: "Name", user: "username" }
let members = [];
let currentVolunteer = null; // { name, user }
let zoomLevel = 1.0;

// Selection
let selectedCells = new Set(); // Set of "r|c"
let anchor = null; 

// --- INITIALIZATION ---
async function init() {
    // 1. Initialize empty grid data structure
    STATIONS.forEach(st => {
        scheduleData[st] = new Array(7).fill(null); // Null indicates empty
    });

    renderGrid();
    setupGlobalEvents(); // Setup key listeners
    
    // 2. Fetch Data
    await fetchMembers();
    
    // 3. Hide loader
    document.getElementById('loading').style.display = 'none';
}

// --- API CALL ---
async function fetchMembers() {
    try {
        // Detect API parameter
        const urlParams = new URLSearchParams(window.location.search);
        const apiBase = urlParams.get('api');
        const endpoint = apiBase ? `${apiBase.replace(/\/$/, '')}/api/members` : '/api/members';
        
        const res = await fetch(endpoint);
        if (!res.ok) throw new Error("API Failed");
        members = await res.json();
    } catch (e) {
        console.warn("API unavailable, using mock data.", e);
        // Fallback mock data
        members = [
            { name: "Austin B", user: "austin" },
            { name: "Kitadan", user: "kitadan" },
            { name: "Seja", user: ".s3j" },
            { name: "Test User", user: "testing" }
        ];
    }
}

// --- VIBRANT COLOR GENERATOR ---
function getVolunteerColor(name) {
    if (!name) return 'white';
    let hash = 0;
    // Add salt to scramble colors more
    const str = name + "salt123"; 
    for (let i = 0; i < str.length; i++) {
        hash = str.charCodeAt(i) + ((hash << 5) - hash);
    }
    const h = Math.abs(hash % 360);
    // High Saturation (75%), Medium-High Lightness (75%) for vibrant but readable
    return `hsl(${h}, 75%, 75%)`;
}

// --- RENDERING ---
function renderGrid() {
    const tbody = document.querySelector('#schedule-table tbody');
    tbody.innerHTML = '';

    STATIONS.forEach((station, r) => {
        const tr = document.createElement('tr');
        
        // Station Header
        const th = document.createElement('td');
        th.className = 'station-cell';
        th.textContent = station;
        tr.appendChild(th);

        // Days
        scheduleData[station].forEach((entry, c) => {
            const td = document.createElement('td');
            td.className = 'data-cell';
            td.dataset.coord = `${r}|${c}`;

            if (entry) {
                // Render Name and Subtitle
                td.classList.add('assigned');
                td.style.backgroundColor = getVolunteerColor(entry.name);
                
                const wrapper = document.createElement('div');
                wrapper.className = 'cell-content-wrapper';
                
                const nameSpan = document.createElement('div');
                nameSpan.className = 'cell-name';
                nameSpan.textContent = entry.name;
                
                const userSpan = document.createElement('div');
                userSpan.className = 'cell-username';
                userSpan.textContent = '@' + entry.user;
                
                wrapper.appendChild(nameSpan);
                wrapper.appendChild(userSpan);
                td.appendChild(wrapper);
            } else {
                td.textContent = "";
            }

            // Re-apply selection visual
            if (selectedCells.has(`${r}|${c}`)) {
                td.classList.add('selected');
            }

            // Interactions
            td.onmousedown = (e) => handleMouseDown(e, r, c);
            td.onmouseover = (e) => handleMouseOver(e, r, c);

            tr.appendChild(td);
        });
        tbody.appendChild(tr);
    });
}

function updateVisualsOnly() {
    document.querySelectorAll('.data-cell').forEach(td => {
        const coord = td.dataset.coord;
        
        // Selection
        if (selectedCells.has(coord)) td.classList.add('selected');
        else td.classList.remove('selected');
        
        // Focus ring
        if (anchor && td.dataset.coord === `${anchor.r}|${anchor.c}`) {
            td.classList.add('focus');
        } else {
            td.classList.remove('focus');
        }
    });
}

// --- MOUSE INTERACTIONS ---
let isDragging = false;

function handleMouseDown(e, r, c) {
    // Only left click
    if (e.button !== 0) return;
    
    isDragging = true;
    const coord = `${r}|${c}`;

    if (e.shiftKey && anchor) {
        selectRange(anchor.r, anchor.c, r, c);
    } else if (e.ctrlKey || e.metaKey) {
        // Toggle specific cell
        if (selectedCells.has(coord)) selectedCells.delete(coord);
        else selectedCells.add(coord);
        anchor = {r, c}; 
    } else {
        // New single selection
        selectedCells.clear();
        selectedCells.add(coord);
        anchor = {r, c};
    }
    updateVisualsOnly();
}

function handleMouseOver(e, r, c) {
    if (isDragging && anchor) {
        // Standard Drag Selection (clears disjoints for simplicity)
        selectedCells.clear();
        selectRange(anchor.r, anchor.c, r, c);
        updateVisualsOnly();
    }
}

function selectRange(r1, c1, r2, c2) {
    const rMin = Math.min(r1, r2);
    const rMax = Math.max(r1, r2);
    const cMin = Math.min(c1, c2);
    const cMax = Math.max(c1, c2);

    for (let i = rMin; i <= rMax; i++) {
        for (let j = cMin; j <= cMax; j++) {
            selectedCells.add(`${i}|${j}`);
        }
    }
}

function setupGlobalEvents() {
    document.addEventListener('mouseup', () => isDragging = false);
    document.addEventListener('keydown', handleKeydown);
    
    // Close menu when clicking outside
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.menu-container')) {
            document.getElementById('main-menu').classList.remove('open');
        }
    });
}

// --- MENU TOGGLE ---
function toggleMenu() {
    const menu = document.getElementById('main-menu');
    menu.classList.toggle('open');
}

// --- SEARCH ---
const searchInput = document.getElementById('member-search');
const resultsBox = document.getElementById('search-results');
const selectionBadge = document.getElementById('selection-display');

searchInput.addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    resultsBox.innerHTML = '';
    if (!q) { resultsBox.style.display = 'none'; return; }

    const matches = members.filter(m => 
        m.name.toLowerCase().includes(q) || 
        m.user.toLowerCase().includes(q)
    );

    if (matches.length > 0) {
        resultsBox.style.display = 'block';
        matches.forEach(m => {
            const div = document.createElement('div');
            div.className = 'result-item';
            div.innerHTML = `
                <span class="result-name">${m.name}</span> 
                <span class="result-user">@${m.user}</span>
            `;
            div.onmousedown = (ev) => {
                ev.preventDefault(); // Keep focus
                setVolunteer(m);
            };
            resultsBox.appendChild(div);
        });
    } else {
        resultsBox.style.display = 'none';
    }
});

function setVolunteer(m) {
    currentVolunteer = m;
    selectionBadge.className = 'current-selection';
    selectionBadge.style.backgroundColor = getVolunteerColor(m.name);
    // Calculate text color based on brightness could be done here, 
    // but dark text usually works on these vibrant pastels.
    selectionBadge.style.color = '#1a2616'; 
    selectionBadge.innerHTML = `<span>👤</span> ${m.name}`;
    searchInput.value = '';
    resultsBox.style.display = 'none';
}

// --- KEYBOARD ---
function handleKeydown(e) {
    if (e.target.tagName === 'INPUT') return;

    if (e.key === 'Backspace' || e.key === 'Delete') {
        applyValue(null); // Clear
    } else if (e.key === 'Enter') {
        if (currentVolunteer) applyValue(currentVolunteer);
        else searchInput.focus();
    } else if (e.key === 'Escape') {
        selectedCells.clear();
        updateVisualsOnly();
    } else if (e.key.startsWith('Arrow')) {
        e.preventDefault();
        if (!anchor) anchor = {r:0, c:0};
        
        let {r, c} = anchor;
        if (e.key === 'ArrowUp') r = Math.max(0, r-1);
        if (e.key === 'ArrowDown') r = Math.min(STATIONS.length-1, r+1);
        if (e.key === 'ArrowLeft') c = Math.max(0, c-1);
        if (e.key === 'ArrowRight') c = Math.min(6, c+1);

        // Ctrl/Cmd jump to edge
        if (e.ctrlKey || e.metaKey) {
            if (e.key === 'ArrowUp') r = 0;
            if (e.key === 'ArrowDown') r = STATIONS.length-1;
            if (e.key === 'ArrowLeft') c = 0;
            if (e.key === 'ArrowRight') c = 6;
        }

        anchor = {r, c};

        if (e.shiftKey) {
             selectedCells.add(`${r}|${c}`); 
        } else {
            selectedCells.clear();
            selectedCells.add(`${r}|${c}`);
        }
        
        const cell = document.querySelector(`.data-cell[data-coord="${r}|${c}"]`);
        // "nearest" prevents the sticky header jump issue often
        cell?.scrollIntoView({block: 'nearest', inline: 'nearest'});
        
        updateVisualsOnly();
    }
}

function applyValue(volunteerObj) {
    selectedCells.forEach(coord => {
        const [r, c] = coord.split('|').map(Number);
        scheduleData[STATIONS[r]][c] = volunteerObj; // Store whole object or null
    });
    renderGrid();
}

// --- ZOOM ---
function adjustZoom(delta) {
    zoomLevel = Math.max(0.5, Math.min(1.5, zoomLevel + delta));
    applyZoom();
}
function resetZoom() {
    const containerW = document.getElementById('workspace').clientWidth;
    const tableW = document.getElementById('schedule-table').offsetWidth;
    // Fit logic
    zoomLevel = Math.min(1.0, (containerW - 80) / tableW);
    if (zoomLevel < 0.5) zoomLevel = 0.5; 
    applyZoom();
}
function applyZoom() {
    document.getElementById('zoom-display').textContent = Math.round(zoomLevel * 100) + '%';
    // Applying transform to a wrapper DIV instead of the table directly helps sticky headers behave
    document.getElementById('sheet-scaler').style.transform = `scale(${zoomLevel})`;
}

// Start
init();

</script>
</body>
</html>
