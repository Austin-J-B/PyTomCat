<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feeding Schedule | Campus Cat Coalition</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700;900&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            /* --- SITE COLORS --- */
            --site-bg: #FFF9F3;       
            --site-text: #414B3B;     
            --site-accent: #8CA87C;   
            --site-white: #FFFFFF;
            
            /* --- THEME COLORS --- */
            --workspace-bg: #C5D6BA;   
            --workspace-dot: rgba(65, 75, 59, 0.15); /* Lighter dots */

            /* --- FUNCTIONAL COLORS --- */
            --grid-line: #E0E5D0;
            --selection-highlight: rgba(140, 168, 124, 0.4); 
            --focus-ring: #414B3B;
            
            /* Header Height Calculation for Sticky Positioning */
            --legend-height: 35px; /* Reduced height */
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--site-bg);
            color: var(--site-text);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- SIDEBAR MENU --- */
        .sidebar-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .sidebar-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .sidebar-menu {
            position: fixed;
            top: 0; left: 0; bottom: 0;
            width: 280px;
            background: white;
            z-index: 2100;
            transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 2px 0 12px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            padding: 20px 0;
        }

        .sidebar-menu.active {
            transform: translateX(0);
        }

        .sidebar-header {
            padding: 0 24px 20px 24px;
            border-bottom: 1px solid var(--grid-line);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-title a {
            font-family: 'Merriweather', serif;
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--site-text);
            text-decoration: none;
        }
        .sidebar-title a:hover { text-decoration: underline; }

        .close-menu-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--site-text);
        }

        .sidebar-content {
            padding: 10px 0;
            overflow-y: auto;
        }

        .menu-item {
            display: block;
            padding: 12px 24px;
            text-decoration: none;
            color: var(--site-text);
            font-weight: 500;
            font-size: 0.95rem;
            transition: background 0.1s;
            border-left: 3px solid transparent;
        }

        .menu-item:hover {
            background-color: #f7f9f5;
            border-left-color: var(--site-accent);
        }

        /* --- HEADER (High Z-Index to stay above table) --- */
        header.site-header {
            background-color: var(--site-bg);
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(65, 75, 59, 0.1);
            flex-shrink: 0;
            /* CRITICAL: This must be higher than the table's headers */
            z-index: 1000; 
            position: relative;
        }

        .menu-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .hamburger-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .hamburger-btn span {
            display: block;
            width: 20px;
            height: 2px;
            background-color: var(--site-text);
            border-radius: 2px;
        }

        h1.page-title { margin: 0; display: flex; align-items: center; }
        h1.page-title a {
            font-family: 'Merriweather', serif;
            font-weight: 900;
            font-size: 1.6rem;
            color: var(--site-text);
            letter-spacing: -0.01em;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        h1.page-title a:hover { opacity: 0.7; }

        .controls-area { display: flex; gap: 15px; align-items: center; }

        /* --- SEARCH --- */
        .search-container { position: relative; width: 280px; }

        input#member-search {
            width: 100%;
            padding: 10px 20px;
            border: 1px solid var(--site-text);
            background: transparent;
            border-radius: 50px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            color: var(--site-text);
            outline: none;
            transition: all 0.2s ease;
        }

        input#member-search:focus {
            background: white;
            box-shadow: 0 4px 12px rgba(65, 75, 59, 0.1);
        }

        input#member-search::placeholder {
            color: var(--site-accent);
            font-weight: 300;
            font-style: italic;
        }

        .search-results {
            position: absolute; top: 110%; left: 0; width: 100%;
            background: white; border-radius: 12px;
            box-shadow: 0 8px 20px rgba(65, 75, 59, 0.25);
            overflow: hidden; display: none; 
            /* Extremely high z-index to ensure it floats over everything */
            z-index: 2000; 
            max-height: 300px; overflow-y: auto;
        }

        .result-item {
            padding: 12px 20px; cursor: pointer;
            display: flex; justify-content: space-between;
            border-bottom: 1px solid #f0f0f0; transition: background 0.1s;
            border-left: 3px solid transparent;
        }
        .result-item:hover, .result-item.active { 
            background-color: #f7f9f5; 
            border-left-color: var(--site-accent);
        }
        .result-name { font-weight: 600; color: var(--site-text); }
        .result-user { font-size: 0.8rem; color: var(--site-accent); }

        /* --- TOOLS --- */
        .tool-btn {
            background: transparent; border: 1px solid var(--site-text);
            color: var(--site-text); width: 32px; height: 32px;
            border-radius: 50%; cursor: pointer; display: flex;
            align-items: center; justify-content: center;
            font-size: 1rem; transition: all 0.2s; padding: 0;
        }
        .tool-btn svg { width: 16px; height: 16px; fill: currentColor; }
        .tool-btn:hover { background: var(--site-text); color: var(--site-bg); }

        #zoom-display {
            font-size: 0.85rem; font-weight: 600; min-width: 45px; text-align: center;
        }

        .current-selection {
            background: var(--site-text); color: white;
            padding: 8px 20px; border-radius: 50px;
            font-weight: 600; font-size: 0.9rem;
            display: flex; align-items: center; gap: 8px;
            min-width: 150px; justify-content: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .current-selection.empty {
            background: rgba(65, 75, 59, 0.1); color: var(--site-text); box-shadow: none;
        }

        /* --- MAIN WORKSPACE --- */
        .workspace {
            flex: 1;
            overflow: auto; /* SCROLL HAPPENS HERE */
            padding: 0 40px 40px 40px; 
            display: grid;
            place-items: start center;
            background-color: var(--workspace-bg);
            /* Lighter dots */
            background-image: radial-gradient(var(--workspace-dot) 1px, transparent 1px);
            background-size: 20px 20px;
            z-index: 10;
        }

        .sheet-wrapper {
            background: white;
            padding: 0;
            border-radius: 0 0 4px 4px;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.4);
            transform-origin: top center;
            transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1);
            display: flex;
            flex-direction: column;
            margin-top: 40px; 
        }

        /* --- CONTROLS LEGEND (STICKY) --- */
        .controls-legend {
            position: sticky;
            top: 0;
            z-index: 300; 
            height: var(--legend-height);

            background: white; 
            color: var(--site-text);
            padding: 0 25px; 
            border-bottom: 1px solid var(--grid-line);
            
            display: flex;
            align-items: center;
            justify-content: flex-start; 
            gap: 25px;
            
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', sans-serif;
            font-size: 0.8rem; 
            font-weight: 400; /* Not bold */
            letter-spacing: 0.02em;
        }

        .key-combo {
            display: inline-flex;
            align-items: center;
            white-space: nowrap;
        }

        table {
            border-collapse: collapse; /* Can cause sticky issues, but needed for look */
            background: white;
            color: var(--site-text);
            user-select: none;
            border-spacing: 0; /* Ensure no gaps */
        }

        /* --- TABLE HEADERS (STICKY) --- */
        th {
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            padding: 15px;
            
            /* STICKY POS */
            position: sticky;
            top: var(--legend-height); 
            z-index: 200; 
            
            background-color: white; 
            /* Removed padding-box to fix the gap */
            
            /* Solid Unified Border */
            border-bottom: 4px solid var(--site-text); 
            
            color: var(--site-text);
        }

        /* Corner piece needs to stay on top of side headers too */
        th:first-child {
            z-index: 250;
            left: 0;
            background-color: white;
            border-right: 2px solid var(--site-text);
        }

        /* --- ROW HEADERS (Stations) --- */
        .station-cell {
            font-family: 'Merriweather', serif;
            font-weight: 700;
            font-size: 0.95rem;
            padding: 0 20px;
            text-align: left;
            
            background-color: #F9FBF7; 
            border-bottom: 1px solid var(--grid-line);
            border-right: 2px solid var(--site-text);
            
            position: sticky;
            left: 0;
            z-index: 100; 
            width: 220px;
        }

        /* --- DATA CELLS --- */
        td.data-cell {
            width: 160px;
            height: 75px; 
            border-bottom: 1px solid var(--grid-line);
            border-right: 1px solid var(--grid-line);
            text-align: center;
            vertical-align: middle;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            position: relative;
            transition: background-color 0.05s;
            padding: 5px;
            line-height: 1.2;
        }

        .cell-name {
            display: block;
            font-weight: 600;
            color: #2b3326;
        }
        
        .cell-user {
            display: block;
            font-size: 0.75rem;
            color: #333333; 
            margin-top: 2px;
            font-weight: 400;
        }

        td.data-cell.focus {
            outline: 2px solid var(--focus-ring);
            outline-offset: -2px;
            z-index: 150;
        }

        td.data-cell.selected {
            background-color: var(--selection-highlight) !important;
        }

        td.data-cell.assigned .cell-name {
            text-shadow: 0 1px 0 rgba(255,255,255,0.4);
        }

        #loading {
            position: fixed; inset: 0;
            background: var(--site-bg);
            z-index: 9999;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            color: var(--site-text); font-family: 'Merriweather', serif;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>

    <div id="loading">
        <div>Loading Schedule...</div>
    </div>

    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleMenu()"></div>
    <div class="sidebar-menu" id="main-menu">
        <div class="sidebar-header">
            <span class="sidebar-title">
                <a href="https://github.com/austin-j-b/pytomcat" target="_blank">TomCat-VI UI</a>
            </span>
            <button class="close-menu-btn" onclick="toggleMenu()">×</button>
        </div>
        <div class="sidebar-content">
            <a href="#" class="menu-item" onclick="toggleMenu()">Feeding Schedule</a>
            <a href="https://github.com/austin-j-b/pytomcat" class="menu-item" target="_blank">TomCat VI Repository</a>
        </div>
    </div>

    <header class="site-header">
        <div class="menu-container">
            <button class="hamburger-btn" onclick="toggleMenu()" title="Open Menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            
            <h1 class="page-title">
                <a href="https://www.catsofuta.org/" target="_blank">Campus Cat Coalition</a>
            </h1>
        </div>

        <div class="controls-area">
            <button class="tool-btn" onclick="adjustZoom(-0.1)" title="Zoom Out">-</button>
            <div id="zoom-display">100%</div>
            <button class="tool-btn" onclick="adjustZoom(0.1)" title="Zoom In">+</button>
            <button class="tool-btn" onclick="resetZoom()" title="Reset Zoom">
                <svg viewBox="0 0 24 24">
                    <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                </svg>
            </button>

            <div class="search-container">
                <input type="text" id="member-search" placeholder="Search Volunteer..." autocomplete="off">
                <div id="search-results" class="search-results"></div>
            </div>

            <div id="selection-display" class="current-selection empty">
                Select User
            </div>
        </div>
    </header>

    <div class="workspace" id="workspace">
        <div class="sheet-wrapper" id="sheet-container">
            <div class="controls-legend">
                <div class="key-combo">"Click" to select</div>
                <div class="key-combo">"Ctrl" + "Click" to multi-select</div>
                <div class="key-combo">"Shift" + "Click" for range</div>
                <div class="key-combo">"Enter" to assign</div>
                <div class="key-combo">"Del" to erase</div>
            </div>

            <table id="schedule-table">
                <thead>
                    <tr>
                        <th>Station</th>
                        <th>Sunday</th>
                        <th>Monday</th>
                        <th>Tuesday</th>
                        <th>Wednesday</th>
                        <th>Thursday</th>
                        <th>Friday</th>
                        <th>Saturday</th>
                    </tr>
                </thead>
                <tbody>
                    </tbody>
            </table>
        </div>
    </div>

<script>
// --- CONFIG ---
const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const STATIONS = [
    "Microwave", "Snickers", "Business", "The Greens", "HOP", 
    "Lot 50", "Mary Kay & Zen", "West Hall", "Maintenance"
];

// --- STATE ---
let scheduleData = {};
let members = [];
let currentVolunteer = null;
let zoomLevel = 1.0;
let currentSearchIndex = -1; // Track arrow key selection

// Selection
let selectedCells = new Set(); 
let anchor = null; 

// --- INITIALIZATION ---
async function init() {
    STATIONS.forEach(st => {
        scheduleData[st] = new Array(7).fill("");
    });

    renderGrid();
    await fetchMembers();
    document.getElementById('loading').style.display = 'none';
}

// --- API CALL ---
async function fetchMembers() {
    try {
        const urlParams = new URLSearchParams(window.location.search);
        const apiBase = urlParams.get('api');
        const endpoint = apiBase ? `${apiBase.replace(/\/$/, '')}/api/members` : '/api/members';
        
        const res = await fetch(endpoint);
        if (!res.ok) throw new Error("API Failed");
        members = await res.json();
    } catch (e) {
        console.warn("API unavailable, using mock data.");
        members = [
            { name: "Austin B", user: "austin" },
            { name: "Kitadan", user: "kitadan" },
            { name: "Seja", user: ".s3j" },
            { name: "Volunteer 1", user: "v1" },
            { name: "Volunteer 2", user: "v2" },
            { name: "Volunteer 3", user: "v3" }
        ];
    }
}

// --- COLOR GENERATOR ---
function getVolunteerColor(name) {
    if (!name) return 'white';
    let hash = 0x811c9dc5; 
    for (let i = 0; i < name.length; i++) {
        hash ^= name.charCodeAt(i);
        hash = Math.imul(hash, 0x01000193);
    }
    const hue = Math.abs(hash % 360);
    return `hsl(${hue}, 80%, 75%)`; 
}

// --- MENU TOGGLE ---
function toggleMenu() {
    const menu = document.getElementById('main-menu');
    const overlay = document.getElementById('sidebar-overlay');
    menu.classList.toggle('active');
    overlay.classList.toggle('active');
}

// --- RENDERING ---
function renderGrid() {
    const tbody = document.querySelector('#schedule-table tbody');
    tbody.innerHTML = '';

    STATIONS.forEach((station, r) => {
        const tr = document.createElement('tr');
        
        const th = document.createElement('td');
        th.className = 'station-cell';
        th.textContent = station;
        tr.appendChild(th);

        scheduleData[station].forEach((val, c) => {
            const td = document.createElement('td');
            td.className = 'data-cell';
            td.dataset.coord = `${r}|${c}`;

            if (val) {
                td.classList.add('assigned');
                td.style.backgroundColor = getVolunteerColor(val);
                
                const member = members.find(m => m.name === val);
                const userHandle = member ? `@${member.user}` : '';

                td.innerHTML = `
                    <span class="cell-name">${val}</span>
                    ${userHandle ? `<span class="cell-user">${userHandle}</span>` : ''}
                `;
            } else {
                td.innerHTML = '';
            }

            if (selectedCells.has(`${r}|${c}`)) {
                td.classList.add('selected');
            }

            td.onmousedown = (e) => handleMouseDown(e, r, c);
            td.onmouseover = (e) => handleMouseOver(e, r, c);

            tr.appendChild(td);
        });
        tbody.appendChild(tr);
    });
}

function updateVisualsOnly() {
    document.querySelectorAll('.data-cell').forEach(td => {
        const coord = td.dataset.coord;
        if (selectedCells.has(coord)) td.classList.add('selected');
        else td.classList.remove('selected');
        
        if (anchor && td.dataset.coord === `${anchor.r}|${anchor.c}`) {
            td.classList.add('focus');
        } else {
            td.classList.remove('focus');
        }
    });
}

// --- INTERACTIONS ---
let isDragging = false;

function handleMouseDown(e, r, c) {
    isDragging = true;
    const coord = `${r}|${c}`;

    if (e.shiftKey && anchor) {
        selectRange(anchor.r, anchor.c, r, c);
    } else if (e.ctrlKey || e.metaKey) {
        if (selectedCells.has(coord)) selectedCells.delete(coord);
        else selectedCells.add(coord);
        anchor = {r, c}; 
    } else {
        selectedCells.clear();
        selectedCells.add(coord);
        anchor = {r, c};
    }
    updateVisualsOnly();
}

function handleMouseOver(e, r, c) {
    if (isDragging && anchor) {
        selectedCells.clear();
        selectRange(anchor.r, anchor.c, r, c);
        updateVisualsOnly();
    }
}

function selectRange(r1, c1, r2, c2) {
    const rMin = Math.min(r1, r2);
    const rMax = Math.max(r1, r2);
    const cMin = Math.min(c1, c2);
    const cMax = Math.max(c1, c2);

    for (let i = rMin; i <= rMax; i++) {
        for (let j = cMin; j <= cMax; j++) {
            selectedCells.add(`${i}|${j}`);
        }
    }
}

document.addEventListener('mouseup', () => isDragging = false);

// --- SEARCH LOGIC & KEYBOARD NAV ---
const searchInput = document.getElementById('member-search');
const resultsBox = document.getElementById('search-results');
const selectionBadge = document.getElementById('selection-display');
let filteredMembers = [];

searchInput.addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    resultsBox.innerHTML = '';
    currentSearchIndex = -1; // Reset index on new input
    
    if (!q) { resultsBox.style.display = 'none'; return; }

    filteredMembers = members.filter(m => 
        m.name.toLowerCase().includes(q) || 
        m.user.toLowerCase().includes(q)
    );

    if (filteredMembers.length > 0) {
        resultsBox.style.display = 'block';
        filteredMembers.forEach((m, idx) => {
            const div = document.createElement('div');
            div.className = 'result-item';
            div.dataset.index = idx; // Store index
            div.innerHTML = `<span class="result-name">${m.name}</span> <span class="result-user">@${m.user}</span>`;
            div.onmousedown = (ev) => {
                ev.preventDefault();
                setVolunteer(m);
            };
            resultsBox.appendChild(div);
        });
    } else {
        resultsBox.style.display = 'none';
    }
});

// Search Keyboard Navigation
searchInput.addEventListener('keydown', (e) => {
    if (!filteredMembers.length) return;

    if (e.key === 'ArrowDown') {
        e.preventDefault();
        currentSearchIndex = Math.min(currentSearchIndex + 1, filteredMembers.length - 1);
        highlightResult();
    } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        currentSearchIndex = Math.max(currentSearchIndex - 1, 0);
        highlightResult();
    } else if (e.key === 'Enter') {
        e.preventDefault();
        if (currentSearchIndex >= 0 && currentSearchIndex < filteredMembers.length) {
            setVolunteer(filteredMembers[currentSearchIndex]);
        } else {
            // Standard Enter behavior: blur to grid if no selection active
            e.target.blur();
        }
    }
});

function highlightResult() {
    const items = resultsBox.querySelectorAll('.result-item');
    items.forEach(item => item.classList.remove('active'));
    if (currentSearchIndex >= 0 && items[currentSearchIndex]) {
        const activeItem = items[currentSearchIndex];
        activeItem.classList.add('active');
        activeItem.scrollIntoView({ block: 'nearest' });
    }
}

function setVolunteer(m) {
    currentVolunteer = m;
    selectionBadge.className = 'current-selection';
    selectionBadge.style.backgroundColor = getVolunteerColor(m.name);
    selectionBadge.style.color = '#2b3326';
    selectionBadge.textContent = m.name;
    
    searchInput.value = '';
    resultsBox.style.display = 'none';
    currentSearchIndex = -1;
    filteredMembers = [];
    searchInput.blur();
}

// --- KEYBOARD (Grid Actions) ---
document.addEventListener('keydown', (e) => {
    // If focusing input, let input handlers work (except generic Escape)
    if (e.target.tagName === 'INPUT') {
        if (e.key === 'Escape') {
            searchInput.blur();
            resultsBox.style.display = 'none';
        }
        return;
    }

    if (e.key === 'Backspace' || e.key === 'Delete') {
        applyValue("");
    } else if (e.key === 'Enter') {
        if (currentVolunteer) {
            applyValue(currentVolunteer.name);
        } else {
            searchInput.focus();
        }
    } else if (e.key === 'Escape') {
        selectedCells.clear();
        updateVisualsOnly();
    } else if (e.key.startsWith('Arrow')) {
        e.preventDefault();
        if (!anchor) anchor = {r:0, c:0};
        
        let {r, c} = anchor;
        if (e.key === 'ArrowUp') r = Math.max(0, r-1);
        if (e.key === 'ArrowDown') r = Math.min(STATIONS.length-1, r+1);
        if (e.key === 'ArrowLeft') c = Math.max(0, c-1);
        if (e.key === 'ArrowRight') c = Math.min(6, c+1);

        if (e.ctrlKey || e.metaKey) {
            if (e.key === 'ArrowUp') r = 0;
            if (e.key === 'ArrowDown') r = STATIONS.length-1;
            if (e.key === 'ArrowLeft') c = 0;
            if (e.key === 'ArrowRight') c = 6;
        }

        anchor = {r, c};

        if (e.shiftKey) {
             selectedCells.add(`${r}|${c}`); 
        } else {
            selectedCells.clear();
            selectedCells.add(`${r}|${c}`);
        }
        
        const cell = document.querySelector(`.data-cell[data-coord="${r}|${c}"]`);
        cell?.scrollIntoView({block: 'nearest', inline: 'nearest'});
        
        updateVisualsOnly();
    }
});

function applyValue(val) {
    if (selectedCells.size === 0) return;
    
    selectedCells.forEach(coord => {
        const [r, c] = coord.split('|').map(Number);
        scheduleData[STATIONS[r]][c] = val;
    });
    renderGrid();
}

// --- ZOOM ---
function adjustZoom(delta) {
    zoomLevel = Math.max(0.5, Math.min(1.5, zoomLevel + delta));
    applyZoom();
}
function resetZoom() {
    const containerW = document.getElementById('workspace').clientWidth;
    const tableW = document.getElementById('schedule-table').offsetWidth;
    zoomLevel = Math.min(1.0, (containerW - 60) / tableW);
    applyZoom();
}
function applyZoom() {
    document.getElementById('zoom-display').textContent = Math.round(zoomLevel * 100) + '%';
    document.getElementById('sheet-container').style.transform = `scale(${zoomLevel})`;
}

// Run
init();

</script>
</body>
