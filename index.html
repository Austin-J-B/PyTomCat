<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TomCat Feeding Schedule</title>
    <style>
        :root {
            /* Theme: Pastel & Grass Green, Beige/Tan Accents */
            --bg-color: #fdfcf8;       /* Very light cream */
            --card-bg: #ffffff;
            --text-main: #4a5d23;      /* Dark olive/grass green text */
            --text-light: #8c9e75;
            
            --primary: #78b159;        /* Grass Green */
            --primary-hover: #659e46;
            --primary-light: #e6f4db;  /* Pastel Green Highlight */
            
            --accent: #e8dcb5;         /* Tan/Beige */
            --accent-light: #f7f3e8;
            
            --highlight-dim: rgba(120, 177, 89, 0.2); /* Selection Color */
            --border: #e0e5d0;
            
            --header-bg: #f4f9ed;      /* Light Mint for headers */
            --station-bg: #ffffff;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- Toolbar / Header --- */
        .toolbar {
            background: var(--card-bg);
            padding: 0.75rem 1.5rem;
            border-bottom: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 6px -2px rgba(74, 93, 35, 0.05);
            z-index: 20;
            flex-shrink: 0;
        }

        .logo {
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            letter-spacing: -0.02em;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        /* Search Bar */
        .search-wrapper {
            position: relative;
            width: 300px;
        }

        #member-search {
            width: 100%;
            padding: 10px 16px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 0.9rem;
            background: var(--accent-light);
            color: var(--text-main);
            transition: all 0.2s;
        }

        #member-search:focus {
            background: white;
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 4px var(--primary-light);
        }

        .search-results {
            position: absolute;
            top: 115%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 10px 20px -5px rgba(74, 93, 35, 0.15);
            max-height: 400px;
            overflow-y: auto;
            display: none;
            z-index: 100;
        }

        .result-item {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.1s;
        }

        .result-item:last-child { border-bottom: none; }
        .result-item:hover, .result-item.active { background-color: var(--primary-light); }
        
        .result-name { font-weight: 700; font-size: 0.9rem; }
        .result-username { font-size: 0.8rem; color: var(--text-light); }

        /* Zoom Controls */
        .zoom-controls {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            background: var(--accent-light);
            padding: 4px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .zoom-btn {
            border: none;
            background: white;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: var(--text-main);
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            transition: 0.1s;
        }

        .zoom-btn:hover { color: var(--primary); background: #fff; transform: translateY(-1px); }
        #zoom-level { font-size: 0.8rem; font-weight: 600; font-variant-numeric: tabular-nums; width: 45px; text-align: center; color: var(--text-light); }

        /* Selected Member Display */
        .selection-badge {
            padding: 8px 16px;
            background: var(--primary);
            color: white;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px -3px rgba(120, 177, 89, 0.4);
        }
        .selection-badge.empty {
            background: var(--accent-light);
            color: var(--text-light);
            box-shadow: none;
            font-weight: 500;
            border: 1px solid var(--border);
        }

        /* --- Main Grid Area --- */
        .workspace {
            flex: 1;
            overflow: auto;
            background: var(--bg-color); 
            padding: 40px;
            display: grid;
            place-items: start center;
        }

        .sheet-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 8px 30px -5px rgba(74, 93, 35, 0.1);
            transform-origin: top center;
            transition: transform 0.15s cubic-bezier(0.2, 0, 0, 1);
            border: 1px solid var(--border);
            overflow: hidden; /* Clip corners */
        }

        table {
            border-collapse: separate; /* Needed for sticky to work nicely with borders sometimes */
            border-spacing: 0;
            font-size: 0.9rem;
            table-layout: fixed;
            user-select: none;
            min-width: 800px;
        }

        /* Headers */
        th {
            background-color: var(--header-bg);
            color: var(--text-main);
            font-weight: 700;
            padding: 12px;
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 0.08em;
            border-bottom: 1px solid var(--border);
            border-right: 1px solid var(--border);
            height: 40px;
        }

        /* Station Column (Row Headers) */
        .station-cell {
            background-color: var(--card-bg);
            color: var(--text-main);
            font-weight: 700;
            font-size: 0.85rem;
            text-align: left;
            padding: 0 16px;
            width: 180px;
            border-bottom: 1px solid var(--border);
            border-right: 1px solid var(--border);
            position: sticky;
            left: 0;
            z-index: 2;
        }
        
        /* Sticky Headers Implementation */
        thead th {
            position: sticky;
            top: 0;
            z-index: 3;
        }
        thead th:first-child {
            z-index: 4;
            left: 0;
            background-color: var(--header-bg);
        }

        /* Data Cells */
        td.data-cell {
            width: 140px;
            height: 52px;
            border-bottom: 1px solid var(--border);
            border-right: 1px solid var(--border);
            text-align: center;
            vertical-align: middle;
            cursor: pointer;
            position: relative;
            background: white;
            color: var(--text-main);
            font-weight: 500;
            transition: background-color 0.05s;
        }

        /* --- Interaction States --- */
        
        /* Active Focus (Cursor) */
        td.data-cell.focus {
            outline: 2px solid var(--primary);
            outline-offset: -2px;
            z-index: 5;
        }

        /* Selected Range */
        td.data-cell.selected {
            background-color: var(--highlight-dim) !important; /* Override assigned color slightly */
        }

        /* Assigned Cell Styling */
        td.data-cell.assigned {
            /* Background color set dynamically via JS */
            color: #1a2e05; /* Very dark green text for contrast */
            font-weight: 600;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.03);
        }

        /* Loading Overlay */
        #loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(253, 252, 248, 0.95);
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--primary);
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <div> Fetching Feeding Team...</div>
    </div>

    <header class="toolbar">
        <div class="logo">
            <span></span> TomCat UI
        </div>

        <div class="controls">
            
            <div class="zoom-controls">
                <button class="zoom-btn" id="zoom-out" type="button">−</button>
                <span id="zoom-level">100%</span>
                <button class="zoom-btn" id="zoom-in" type="button">+</button>
                <button class="zoom-btn" id="zoom-fit" type="button" title="Fit to Screen">Fit</button>
            </div>

            <div class="search-wrapper">
                <input type="text" id="member-search" placeholder="Search volunteer..." autocomplete="off">
                <div id="search-results" class="search-results"></div>
            </div>

            <div id="selection-display" class="selection-badge empty">
                No Volunteer Selected
            </div>
        </div>
    </header>

    <div class="workspace" id="workspace">
        <div class="sheet-container" id="sheet-container">
            <table id="schedule-table">
                <thead>
                    <tr>
                        <th>Station</th>
                        <th>Sunday</th>
                        <th>Monday</th>
                        <th>Tuesday</th>
                        <th>Wednesday</th>
                        <th>Thursday</th>
                        <th>Friday</th>
                        <th>Saturday</th>
                    </tr>
                </thead>
                <tbody>
                    </tbody>
            </table>
        </div>
    </div>

<script>
// --- CONFIG ---
const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const STATIONS = [
    "Microwave", "Snickers", "Business", "The Greens", "HOP", 
    "Lot 50", "Mary Kay & Zen", "West Hall", "Maintenance"
];

// --- DATA MODEL ---
// Start EMPTY as requested
let scheduleData = {};
STATIONS.forEach(st => {
    scheduleData[st] = new Array(7).fill(""); 
});

let members = []; 
let currentVolunteer = null;
let zoomLevel = 1.0;

// --- SELECTION STATE ---
let anchorCell = null; // {r, c}
let focusCell = null;  // {r, c}
let selectionRange = null; // {rMin, rMax, cMin, cMax}

/**
 * INITIALIZATION
 */
async function init() {
    renderGrid();
    setupEventListeners();
    await fetchMembers();
    document.getElementById('loading-overlay').style.display = 'none';
}

/**
 * API / DATA FETCHING
 */
async function fetchMembers() {
    searchInput.disabled = true;
    searchInput.placeholder = "Loading volunteers...";
    try {
        const response = await fetch("/api/members", { cache: "no-store" });
        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }
        const data = await response.json();
        if (Array.isArray(data)) {
            members = data
                .map(entry => {
                    const name = (entry?.name || "").trim();
                    const user = (entry?.user || entry?.username || "").trim();
                    const id = entry?.id ? String(entry.id) : undefined;
                    return name ? { name, user, id } : null;
                })
                .filter(Boolean)
                .sort((a, b) => a.name.localeCompare(b.name));
        } else {
            members = [];
        }
    } catch (e) {
        console.error("Failed to fetch members", e);
        members = [];
    } finally {
        searchInput.disabled = false;
        searchInput.placeholder = members.length ? "Search volunteer..." : "No volunteers available";
    }
}

/**
 * HELPER: GENERATE PASTEL COLOR FROM STRING
 * Creates a unique, pleasant hex code for each volunteer name.
 */
function getVolunteerColor(name) {
    if (!name) return 'white';
    let hash = 0;
    for (let i = 0; i < name.length; i++) {
        hash = name.charCodeAt(i) + ((hash << 5) - hash);
    }
    // Restrict Hue to 0-360
    const h = Math.abs(hash % 360);
    // Keep Saturation high (60-80%) and Lightness high (80-90%) for pastel look
    return `hsl(${h}, 70%, 85%)`; 
}

/**
 * RENDER LOGIC
 */
function renderGrid() {
    const tbody = document.querySelector('#schedule-table tbody');
    tbody.innerHTML = '';

    STATIONS.forEach((station, rIndex) => {
        const tr = document.createElement('tr');
        
        // Station Header
        const th = document.createElement('td');
        th.className = 'station-cell';
        th.textContent = station;
        tr.appendChild(th);

        // Days
        scheduleData[station].forEach((volunteerName, cIndex) => {
            const td = document.createElement('td');
            td.className = 'data-cell';
            td.dataset.r = rIndex;
            td.dataset.c = cIndex;
            
            td.textContent = volunteerName || "";
            
            // Apply Volunteer Color
            if (volunteerName) {
                td.classList.add('assigned');
                td.style.backgroundColor = getVolunteerColor(volunteerName);
            } else {
                td.style.backgroundColor = ''; // Reset
            }

            // Mouse Events for Drag Selection
            td.onmousedown = (e) => handleMouseDown(e, rIndex, cIndex);
            td.onmouseover = (e) => handleMouseOver(e, rIndex, cIndex);
            
            tr.appendChild(td);
        });

        tbody.appendChild(tr);
    });
}

function getCell(r, c) {
    return document.querySelector(`.data-cell[data-r="${r}"][data-c="${c}"]`);
}

function updateSelectionVisuals() {
    // Reset visual state only (not data)
    document.querySelectorAll('.data-cell').forEach(td => {
        td.classList.remove('selected', 'focus');
        // Re-apply volunteer colors if they exist (drag might temporarily cover them)
        // Actually CSS .selected will use !important background color for highlight,
        // which is what we want.
    });

    if (!focusCell) return;

    // Highlight Range
    if (selectionRange) {
        for (let r = selectionRange.rMin; r <= selectionRange.rMax; r++) {
            for (let c = selectionRange.cMin; c <= selectionRange.cMax; c++) {
                const cell = getCell(r, c);
                if (cell) cell.classList.add('selected');
            }
        }
    }

    // Focus Cursor
    const fCell = getCell(focusCell.r, focusCell.c);
    if (fCell) fCell.classList.add('focus');
}


/**
 * SEARCH & SELECTION
 */
const searchInput = document.getElementById('member-search');
const resultsBox = document.getElementById('search-results');
const selectionBadge = document.getElementById('selection-display');
const zoomOutBtn = document.getElementById('zoom-out');
const zoomInBtn = document.getElementById('zoom-in');
const zoomFitBtn = document.getElementById('zoom-fit');

function setupEventListeners() {
    zoomOutBtn?.addEventListener('click', () => adjustZoom(-0.1));
    zoomInBtn?.addEventListener('click', () => adjustZoom(0.1));
    zoomFitBtn?.addEventListener('click', () => resetZoom());

    searchInput.addEventListener('input', (e) => {
        const q = e.target.value.toLowerCase();
        resultsBox.innerHTML = '';
        
        if (!q) {
            resultsBox.style.display = 'none';
            return;
        }

        const matches = members.filter(m => 
            m.name.toLowerCase().includes(q) || 
            m.user.toLowerCase().includes(q)
        );

        if (matches.length > 0) {
            resultsBox.style.display = 'block';
            matches.forEach(m => {
                const div = document.createElement('div');
                div.className = 'result-item';
                div.innerHTML = `
                    <span class="result-name">${m.name}</span>
                    <span class="result-username">@${m.user}</span>
                `;
                div.onmousedown = (ev) => {
                    // Prevent input blur
                    ev.preventDefault();
                    selectVolunteer(m);
                };
                resultsBox.appendChild(div);
            });
        } else {
            resultsBox.style.display = 'none';
        }
    });

    // Keyboard Nav
    document.addEventListener('keydown', handleKeydown);
    document.addEventListener('mouseup', () => isDragging = false);
}

function selectVolunteer(m) {
    currentVolunteer = m;
    selectionBadge.className = 'selection-badge';
    selectionBadge.style.backgroundColor = getVolunteerColor(m.name);
    selectionBadge.style.color = '#1a2e05'; // Dark text for pastel bg
    selectionBadge.innerHTML = `<span>👤</span> ${m.name}`;
    searchInput.value = '';
    resultsBox.style.display = 'none';
}

/**
 * GRID INTERACTION
 */
let isDragging = false;

function handleMouseDown(e, r, c) {
    isDragging = true;
    if (e.shiftKey && anchorCell) {
        updateSelectionRange(r, c);
    } else {
        anchorCell = {r, c};
        focusCell = {r, c};
        updateSelectionRange(r, c);
    }
    // Prevent text selection cursor
    if(e.detail > 1) e.preventDefault(); 
}

function handleMouseOver(e, r, c) {
    if (isDragging) updateSelectionRange(r, c);
}

function updateSelectionRange(currR, currC) {
    if (!anchorCell) return;
    const rMin = Math.min(anchorCell.r, currR);
    const rMax = Math.max(anchorCell.r, currR);
    const cMin = Math.min(anchorCell.c, currC);
    const cMax = Math.max(anchorCell.c, currC);
    selectionRange = {rMin, rMax, cMin, cMax};
    updateSelectionVisuals();
}

function handleKeydown(e) {
    if (e.target.tagName === 'INPUT') {
        // Allow Escape to blur input
        if(e.key === 'Escape') e.target.blur();
        return; 
    }

    if (e.key === 'Backspace' || e.key === 'Delete') {
        applyToSelection("");
        return;
    }

    if (e.key === 'Enter') {
        if (currentVolunteer) {
            applyToSelection(currentVolunteer.name);
        } else {
            // Shake effect or alert
            const badge = document.getElementById('selection-display');
            badge.style.transform = 'translateX(5px)';
            setTimeout(() => badge.style.transform = 'translateX(0)', 100);
            searchInput.focus();
        }
        return;
    }

    if (e.key === 'Escape') {
        selectionRange = null;
        anchorCell = null;
        focusCell = null;
        updateSelectionVisuals();
        return;
    }

    // Arrow Navigation
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
        e.preventDefault();
        if (!focusCell) {
            // Start top left if nothing selected
            anchorCell = focusCell = {r:0, c:0};
            updateSelectionRange(0,0);
            return;
        }

        let nr = focusCell.r;
        let nc = focusCell.c;
        
        // Ctrl/Cmd jumps to edge
        if (e.ctrlKey || e.metaKey) {
             if (e.key === 'ArrowUp') nr = 0;
             if (e.key === 'ArrowDown') nr = STATIONS.length - 1;
             if (e.key === 'ArrowLeft') nc = 0;
             if (e.key === 'ArrowRight') nc = DAYS.length - 1;
        } else {
             if (e.key === 'ArrowUp') nr = Math.max(0, nr - 1);
             if (e.key === 'ArrowDown') nr = Math.min(STATIONS.length - 1, nr + 1);
             if (e.key === 'ArrowLeft') nc = Math.max(0, nc - 1);
             if (e.key === 'ArrowRight') nc = Math.min(DAYS.length - 1, nc + 1);
        }

        focusCell = {r: nr, c: nc};
        
        if (e.shiftKey) {
            updateSelectionRange(nr, nc);
        } else {
            anchorCell = {r: nr, c: nc};
            updateSelectionRange(nr, nc);
        }
        
        getCell(nr, nc)?.scrollIntoView({block: 'nearest', inline: 'nearest'});
    }
}

function applyToSelection(value) {
    if (!selectionRange) return;
    // Update Data
    for (let r = selectionRange.rMin; r <= selectionRange.rMax; r++) {
        const station = STATIONS[r];
        for (let c = selectionRange.cMin; c <= selectionRange.cMax; c++) {
            scheduleData[station][c] = value;
        }
    }
    // Full re-render to apply colors correctly
    renderGrid();
    // Re-apply selection visual because render wipes it
    updateSelectionVisuals();
}

/**
 * ZOOM LOGIC
 */
function adjustZoom(delta) {
    zoomLevel = Math.max(0.5, Math.min(1.5, zoomLevel + delta));
    applyZoom();
}

function resetZoom() {
    const containerW = document.getElementById('workspace').clientWidth;
    const tableW = document.getElementById('schedule-table').offsetWidth;
    // Fit width with some padding
    let ratio = (containerW - 60) / tableW;
    zoomLevel = Math.min(1.0, Math.max(0.5, ratio));
    applyZoom();
}

function applyZoom() {
    document.getElementById('zoom-level').textContent = Math.round(zoomLevel * 100) + '%';
    document.getElementById('sheet-container').style.transform = `scale(${zoomLevel})`;
}

// Kickoff
init();

</script>
</body>
</html>
