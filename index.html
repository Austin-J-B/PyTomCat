<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feeding Schedule | Campus Cat Coalition</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700;900&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@discord/embedded-app-sdk/dist/discord.min.js"></script>

    <style>
        :root {
            --site-bg: #FFF9F3;       
            --header-tan: #FFF9F3; 
            --site-text: #414B3B;     
            --site-accent: #8CA87C;   
            --site-white: #FFFFFF;
            --workspace-bg: #C5D6BA;   
            --workspace-dot: rgba(65, 75, 59, 0.15); 
            --grid-line: #E0E5D0;
            --selection-highlight: rgba(140, 168, 124, 0.4); 
            --focus-ring: #414B3B;
            --legend-height: 40px;

            /* Zoom Variables */
            --zoom-scale: 1;
            --base-cell-width: 160px;
            --base-cell-height: 75px;
            --base-font-size: 0.95rem;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--site-bg);
            color: var(--site-text);
            margin: 0; padding: 0; height: 100vh;
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* LOADING OVERLAY */
        #loading {
            position: fixed; inset: 0; background: var(--site-bg); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: var(--site-text); font-family: 'Merriweather', serif; font-size: 1.5rem;
            transition: opacity 0.3s;
        }

        /* SIDEBAR */
        .sidebar-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); z-index: 2000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .sidebar-overlay.active { opacity: 1; pointer-events: all; }

        .sidebar-menu {
            position: fixed; top: 0; left: 0; bottom: 0; width: 280px;
            background: white; z-index: 2100; transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 2px 0 12px rgba(0,0,0,0.15); display: flex; flex-direction: column; padding: 20px 0;
        }
        .sidebar-menu.active { transform: translateX(0); }

        .sidebar-header {
            padding: 0 24px 20px 24px; border-bottom: 1px solid var(--grid-line);
            display: flex; justify-content: space-between; align-items: center;
        }
        .sidebar-title a {
            font-family: 'Merriweather', serif; font-weight: 700; font-size: 1.2rem;
            color: var(--site-text); text-decoration: none; cursor: pointer;
        }
        .close-menu-btn {
            background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--site-text);
        }
        .menu-item {
            display: block; padding: 12px 24px; text-decoration: none; color: var(--site-text);
            font-weight: 500; transition: background 0.1s; border-left: 3px solid transparent; cursor: pointer;
        }
        .menu-item:hover { background-color: #f7f9f5; border-left-color: var(--site-accent); }

        /* HEADER */
        header.site-header {
            background-color: var(--header-tan); padding: 15px 20px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid rgba(65, 75, 59, 0.15); flex-shrink: 0; z-index: 1000;
        }
        .menu-container { display: flex; align-items: center; gap: 20px; }
        
        /* Fixed Hamburger Button */
        .hamburger-btn {
            background: none; border: none; cursor: pointer; padding: 5px;
            display: flex; flex-direction: column; gap: 5px;
            z-index: 1001; /* Ensure clickable */
        }
        .hamburger-btn span {
            display: block; width: 20px; height: 2px; background-color: var(--site-text); border-radius: 2px;
        }
        
        h1.page-title a {
            font-family: 'Merriweather', serif; font-weight: 900; font-size: 1.4rem;
            color: var(--site-text); text-decoration: none; cursor: pointer;
            white-space: nowrap;
        }

        .controls-area { display: flex; gap: 12px; align-items: center; }

        /* SEARCH (COMPACT) */
        .search-container { position: relative; width: 180px; }
        input#member-search {
            width: 100%; padding: 8px 15px; border: 1px solid var(--site-text);
            background: transparent; border-radius: 50px;
            font-family: 'Montserrat', sans-serif; font-size: 0.85rem; color: var(--site-text); outline: none;
        }
        input#member-search:focus { background: white; box-shadow: 0 4px 12px rgba(65, 75, 59, 0.1); }
        .search-results {
            position: absolute; top: 110%; left: 0; width: 240px;
            background: white; border-radius: 12px; box-shadow: 0 8px 20px rgba(65, 75, 59, 0.25);
            overflow: hidden; display: none; z-index: 2000; max-height: 300px; overflow-y: auto;
        }
        .result-item {
            padding: 12px 20px; cursor: pointer; display: flex; justify-content: space-between;
            border-bottom: 1px solid #f0f0f0;
        }
        .result-item:hover, .result-item.active { background-color: #f7f9f5; border-left: 3px solid var(--site-accent); }

        /* TOOLS */
        .tool-btn {
            background: transparent; border: 1px solid var(--site-text);
            color: var(--site-text); width: 28px; height: 28px;
            border-radius: 50%; cursor: pointer; display: flex;
            align-items: center; justify-content: center; font-size: 1rem; transition: all 0.2s;
        }
        .tool-btn:hover { background: var(--site-text); color: var(--site-bg); }
        .tool-btn svg { width: 14px; height: 14px; fill: currentColor; }
        #zoom-display { font-size: 0.8rem; font-weight: 600; min-width: 40px; text-align: center; }

        /* AUTH UI (COMPACT) */
        .current-selection {
            background: var(--site-text); color: white; padding: 6px 16px; border-radius: 50px;
            font-weight: 600; font-size: 0.85rem; display: flex; align-items: center; gap: 8px;
            min-width: 100px; justify-content: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: none; /* Hidden by default to save space */
        }
        .current-selection.active { display: flex; }

        #save-btn {
            background: var(--site-accent); color: white; border: none;
            padding: 6px 18px; border-radius: 50px; font-weight: 700; font-family: 'Montserrat';
            cursor: pointer; display: none; font-size: 0.85rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
        }
        #save-btn:hover { filter: brightness(1.1); }
        
        #auth-icon {
            width: 32px; height: 32px; border-radius: 50%; background: var(--site-accent);
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            color: white; font-weight: 700; font-size: 0.9rem; border: 2px solid var(--site-text);
            overflow: hidden;
        }
        #auth-icon img { width: 100%; height: 100%; object-fit: cover; }
        #auth-icon svg { width: 18px; height: 18px; fill: white; }

        /* WORKSPACE */
        .workspace {
            flex: 1; overflow: auto; padding: 0 40px 40px 40px;
            display: grid; place-items: start center;
            background-color: var(--workspace-bg);
            background-image: radial-gradient(var(--workspace-dot) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .sheet-wrapper {
            background: white; padding: 0; border-radius: 0 0 4px 4px;
            box-shadow: 0 24px 48px -8px rgba(0,0,0,0.45), 0 2px 8px rgba(0,0,0,0.10);
            display: flex; flex-direction: column; margin-top: 40px; 
        }

        /* CONTROLS LEGEND (STICKY) */
        .controls-legend {
            position: sticky; 
            top: 0; 
            z-index: 300; 
            height: var(--legend-height);
            background: var(--header-tan); 
            color: var(--site-text); 
            padding: 0 25px; 
            border-bottom: 2px solid var(--site-text); 
            display: flex; align-items: center;
            justify-content: flex-start; 
            gap: 25px;
            font-family: 'Montserrat', sans-serif; font-size: 0.75rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.05em;
        }

        table { border-collapse: collapse; background: white; color: var(--site-text); user-select: none; border-spacing: 0; }

        /* TABLE HEADER (STICKY) */
        th {
            font-family: 'Montserrat', sans-serif; text-transform: uppercase;
            font-size: 0.75rem; font-weight: 600; letter-spacing: 0.1em; padding: 15px;
            
            position: sticky; 
            top: var(--legend-height); /* STICKY BELOW LEGEND */
            z-index: 200;
            
            background-color: white; 
            border-bottom: 5px solid var(--site-text); color: var(--site-text);
        }
        th:first-child { z-index: 250; left: 0; background-color: white; border-right: 2px solid var(--site-text); }

        .station-cell {
            font-family: 'Merriweather', serif; font-weight: 700; font-size: 0.95rem;
            padding: 0 20px; text-align: left; background-color: #F9FBF7;
            border-bottom: 1px solid var(--grid-line); border-right: 2px solid var(--site-text);
            
            position: sticky; left: 0; z-index: 100; width: 220px;
        }

        td.data-cell {
            width: calc(var(--base-cell-width) * var(--zoom-scale)); 
            height: calc(var(--base-cell-height) * var(--zoom-scale)); 
            border-bottom: 1px solid var(--grid-line);
            border-right: 1px solid var(--grid-line); text-align: center; vertical-align: middle;
            font-weight: 500; 
            font-size: calc(var(--base-font-size) * var(--zoom-scale));
            cursor: pointer; position: relative;
            transition: background-color 0.05s; padding: 5px; line-height: 1.2;
        }
        .cell-name { display: block; font-weight: 600; color: #2b3326; }
        .cell-user { display: block; font-size: 0.75rem; color: #333333; margin-top: 2px; font-weight: 400; }
        td.data-cell.focus { outline: 2px solid var(--focus-ring); outline-offset: -2px; z-index: 150; }
        td.data-cell.selected { background-color: var(--selection-highlight) !important; }

    </style>
</head>
<body>

    <div id="loading">
        <div>Loading Schedule...</div>
    </div>

    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleMenu()"></div>
    <div class="sidebar-menu" id="main-menu">
        <div class="sidebar-header">
            <span class="sidebar-title">
                <a href="https://github.com/austin-j-b/pytomcat" target="_blank">TomCat-VI UI</a>
            </span>
            <button class="close-menu-btn" onclick="toggleMenu()">×</button>
        </div>
        <div class="sidebar-content">
            <a href="#" class="menu-item" onclick="toggleMenu()">Feeding Schedule</a>
            <a href="https://github.com/austin-j-b/pytomcat" class="menu-item" target="_blank">TomCat-VI Repository</a>
        </div>
    </div>

    <header class="site-header">
        <div class="menu-container">
            <button class="hamburger-btn" onclick="toggleMenu()" title="Open Menu">
                <span></span><span></span><span></span>
            </button>
            <h1 class="page-title">
                <a href="https://www.catsofuta.org/" target="_blank">Campus Cat Coalition</a>
            </h1>
        </div>

        <div class="controls-area">
            <button class="tool-btn" onclick="adjustZoom(-0.1)" title="Zoom Out">-</button>
            <div id="zoom-display">100%</div>
            <button class="tool-btn" onclick="adjustZoom(0.1)" title="Zoom In">+</button>
            <button class="tool-btn" onclick="resetZoom()" title="Reset Zoom">
                <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
            </button>

            <div class="search-container">
                <input type="text" id="member-search" placeholder="Search Volunteer..." autocomplete="off">
                <div id="search-results" class="search-results"></div>
            </div>

            <div id="selection-display" class="current-selection">Select User</div>
            
            <button id="save-btn" onclick="saveSchedule()">Save</button>
            
            <div id="auth-icon" onclick="manualLoginPrompt()" title="Login / Guest Mode">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </div>
        </div>
    </header>

    <div class="workspace" id="workspace">
        <div class="sheet-wrapper" id="sheet-container">
            <div class="controls-legend">
                <div>"Click" Select</div>
                <div style="margin-left:15px;">"Ctrl" + "Click" Multi</div>
                <div style="margin-left:15px;">"Shift" + "Click" Range</div>
                <div style="margin-left:15px;">"Enter" Assign</div>
                <div style="margin-left:15px;">"Del" Erase</div>
            </div>

            <table id="schedule-table">
                <thead>
                    <tr>
                        <th>Station</th>
                        <th>Sunday</th><th>Monday</th><th>Tuesday</th>
                        <th>Wednesday</th><th>Thursday</th><th>Friday</th><th>Saturday</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

<script>
// --- CONFIG ---
const STATIONS = [
    "Microwave", "Snickers", "Business", "The Greens", "HOP", 
    "Lot 50", "Mary Kay and Zen", "West Hall", "Maintenance"
];

let scheduleData = {};
let members = [];
let currentVolunteer = null;
let zoomLevel = 1.0;
let currentSearchIndex = -1; 
let selectedCells = new Set(); 
let anchor = null;
let isDragging = false;
let currentUser = null;
let userPerms = { can_edit_schedule: false };

// --- INIT ---
let discordSdk = null;
try {
    discordSdk = new Discord.DiscordSDK("1341667150066225192");
} catch (e) {
    console.warn("Discord SDK failed to init:", e);
}

async function init() {
    // 1. Init empty grid
    STATIONS.forEach(st => scheduleData[st] = new Array(7).fill(""));
    renderGrid();

    // 2. Load Data
    try {
        await Promise.all([fetchSchedule(), fetchMembers()]);
        console.log("Live data loaded.");
    } catch (e) {
        console.warn("API Error:", e);
    } finally {
        renderGrid();
        document.getElementById('loading').style.opacity = '0';
        setTimeout(() => document.getElementById('loading').style.display = 'none', 300);
    }
    
    // 3. Auth
    if (discordSdk) attemptDiscordAuth();
}

// --- API ---
async function fetchSchedule() {
    try {
        const res = await fetch("api/schedule");
        if (!res.ok) throw new Error("Sched 404");
        const json = await res.json();
        // Only load if station exists, otherwise keep empty
        STATIONS.forEach(st => { if(json[st]) scheduleData[st] = json[st]; });
    } catch(e) { 
        console.log("No schedule found or load error. Starting blank."); 
    }
}

async function fetchMembers() {
    const res = await fetch("api/members");
    if (!res.ok) throw new Error("Mem 404");
    members = await res.json();
}

// --- AUTHENTICATION ---
async function attemptDiscordAuth() {
    try {
        await discordSdk.ready();
        const auth = await discordSdk.commands.authorize({
            client_id: "1341667150066225192",
            response_type: "code",
            state: "",
            prompt: "none",
            scope: ["identify", "guilds.members.read"]
        });

        if (auth.code) {
            const res = await fetch("api/auth/token", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({code: auth.code})
            });
            if (res.ok) {
                const data = await res.json();
                applyLogin(data.user, data.permissions);
            }
        }
    } catch (e) { console.log("Guest Mode"); }
}

function applyLogin(user, perms) {
    currentUser = user;
    userPerms = perms;
    
    const icon = document.getElementById('auth-icon');
    icon.title = `Logged in as ${user.username}`;
    
    if (user.avatar) {
        const avUrl = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`;
        icon.innerHTML = `<img src="${avUrl}" alt="${user.username}">`;
    } else {
        // Initials
        const init = user.username ? user.username.substring(0,2).toUpperCase() : "US";
        icon.innerHTML = init;
    }

    if (userPerms.can_edit_schedule) {
        document.getElementById('save-btn').style.display = 'block';
    }
}

function manualLoginPrompt() {
    const uid = prompt("Debug: Enter User ID for permission test:", "624440365595754496");
    if (uid) {
        applyLogin({username: "DebugUser", id: uid}, {can_edit_schedule: true}); 
        alert("Simulated UI login.");
    }
}

async function saveSchedule() {
    if (!currentUser) return;
    const btn = document.getElementById('save-btn');
    const oldText = btn.textContent;
    btn.textContent = "...";
    btn.disabled = true;

    try {
        const res = await fetch("api/schedule/save", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-User-ID": currentUser.id
            },
            body: JSON.stringify(scheduleData)
        });
        
        if (res.ok) {
            btn.textContent = "Done";
            setTimeout(() => { btn.textContent = oldText; btn.disabled = false; }, 1500);
        } else { throw new Error(); }
    } catch (e) {
        alert("Save failed.");
        btn.textContent = oldText;
        btn.disabled = false;
    }
}

// --- UI COLORS ---
const PRESET_COLORS = [
    "#FFB7B2", "#E2F0CB", "#C7CEEA", "#FFDAC1", "#B5EAD7", "#DF9881", "#ECD5E3", "#A0E7E5", 
    "#FBE7C6", "#D4F1F4", "#F4E1D2", "#94D0CC", "#B9B0B0", "#EFC3A4", "#809BCE", "#95B8D1"
];
function getVolunteerColor(name) {
    if (!name) return 'white';
    let hash = 0;
    for (let i=0; i<name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
    return PRESET_COLORS[Math.abs(hash) % PRESET_COLORS.length];
}

// --- RENDER ---
function renderGrid() {
    const tbody = document.querySelector('#schedule-table tbody');
    tbody.innerHTML = '';

    STATIONS.forEach((station, r) => {
        const tr = document.createElement('tr');
        const th = document.createElement('td');
        th.className = 'station-cell';
        th.textContent = station;
        tr.appendChild(th);

        const rowData = scheduleData[station] || new Array(7).fill("");

        rowData.forEach((val, c) => {
            const td = document.createElement('td');
            td.className = 'data-cell';
            td.dataset.coord = `${r}|${c}`;

            if (val) {
                td.classList.add('assigned');
                td.style.backgroundColor = getVolunteerColor(val);
                const member = members.find(m => m.name === val);
                const userHandle = member ? `@${member.user}` : '';
                td.innerHTML = `<span class="cell-name">${val}</span>${userHandle ? `<span class="cell-user">${userHandle}</span>` : ''}`;
            } else { td.innerHTML = ''; }

            if (selectedCells.has(`${r}|${c}`)) td.classList.add('selected');
            td.onmousedown = (e) => handleMouseDown(e, r, c);
            td.onmouseover = (e) => handleMouseOver(e, r, c);
            tr.appendChild(td);
        });
        tbody.appendChild(tr);
    });
}

function updateVisualsOnly() {
    document.querySelectorAll('.data-cell').forEach(td => {
        const coord = td.dataset.coord;
        if (selectedCells.has(coord)) td.classList.add('selected');
        else td.classList.remove('selected');
        if (anchor && td.dataset.coord === `${anchor.r}|${anchor.c}`) td.classList.add('focus');
        else td.classList.remove('focus');
    });
}

// --- INTERACTION ---
function handleMouseDown(e, r, c) {
    isDragging = true;
    const coord = `${r}|${c}`;
    if (e.shiftKey && anchor) selectRange(anchor.r, anchor.c, r, c);
    else if (e.ctrlKey || e.metaKey) {
        if (selectedCells.has(coord)) selectedCells.delete(coord);
        else selectedCells.add(coord);
        anchor = {r, c}; 
    } else {
        selectedCells.clear();
        selectedCells.add(coord);
        anchor = {r, c};
    }
    updateVisualsOnly();
}

function handleMouseOver(e, r, c) {
    if (isDragging && anchor) {
        selectedCells.clear();
        selectRange(anchor.r, anchor.c, r, c);
        updateVisualsOnly();
    }
}

function selectRange(r1, c1, r2, c2) {
    const rMin = Math.min(r1, r2), rMax = Math.max(r1, r2);
    const cMin = Math.min(c1, c2), cMax = Math.max(c1, c2);
    for (let i = rMin; i <= rMax; i++) {
        for (let j = cMin; j <= cMax; j++) {
            selectedCells.add(`${i}|${j}`);
        }
    }
}
document.addEventListener('mouseup', () => isDragging = false);

// --- SEARCH ---
const searchInput = document.getElementById('member-search');
const resultsBox = document.getElementById('search-results');
const selectionBadge = document.getElementById('selection-display');
let filteredMembers = [];

searchInput.addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    resultsBox.innerHTML = '';
    currentSearchIndex = -1; 
    if (!q) { resultsBox.style.display = 'none'; return; }

    filteredMembers = members.filter(m => m.name.toLowerCase().includes(q));
    if (filteredMembers.length > 0) {
        resultsBox.style.display = 'block';
        filteredMembers.forEach((m, idx) => {
            const div = document.createElement('div');
            div.className = 'result-item';
            div.innerHTML = `<span class="result-name">${m.name}</span> <span class="result-user">@${m.user}</span>`;
            div.onmousedown = (ev) => { ev.preventDefault(); setVolunteer(m); };
            resultsBox.appendChild(div);
        });
    } else { resultsBox.style.display = 'none'; }
});

function setVolunteer(m) {
    currentVolunteer = m;
    selectionBadge.classList.add('active');
    selectionBadge.style.backgroundColor = getVolunteerColor(m.name);
    selectionBadge.style.color = '#2b3326';
    selectionBadge.textContent = m.name;
    searchInput.value = '';
    resultsBox.style.display = 'none';
}

// --- KEYBOARD ---
document.addEventListener('keydown', (e) => {
    const isNav = e.key.startsWith('Arrow') || e.key === 'Escape';
    if (e.target.tagName === 'INPUT') {
        if (e.key === 'Escape') { searchInput.blur(); resultsBox.style.display = 'none'; }
        return;
    }
    if (!userPerms.can_edit_schedule && !isNav && currentUser) return; 

    if (e.key === 'Backspace' || e.key === 'Delete') applyValue("");
    else if (e.key === 'Enter') {
        if (currentVolunteer) applyValue(currentVolunteer.name);
        else searchInput.focus();
    } else if (e.key === 'Escape') { selectedCells.clear(); updateVisualsOnly(); }
    else if (e.key.startsWith('Arrow')) {
        e.preventDefault();
        if (!anchor) anchor = {r:0, c:0};
        let {r, c} = anchor;
        if (e.key === 'ArrowUp') r = Math.max(0, r-1);
        if (e.key === 'ArrowDown') r = Math.min(STATIONS.length-1, r+1);
        if (e.key === 'ArrowLeft') c = Math.max(0, c-1);
        if (e.key === 'ArrowRight') c = Math.min(6, c+1);
        anchor = {r, c};
        if (e.shiftKey) selectedCells.add(`${r}|${c}`);
        else { selectedCells.clear(); selectedCells.add(`${r}|${c}`); }
        const cell = document.querySelector(`.data-cell[data-coord="${r}|${c}"]`);
        cell?.scrollIntoView({block: 'nearest', inline: 'nearest'});
        updateVisualsOnly();
    }
});

function applyValue(val) {
    if (selectedCells.size === 0) return;
    if (!userPerms.can_edit_schedule && currentUser) return;
    selectedCells.forEach(coord => {
        const [r, c] = coord.split('|').map(Number);
        scheduleData[STATIONS[r]][c] = val;
    });
    renderGrid();
}

// --- ZOOM (CSS VARS) ---
function adjustZoom(delta) {
    zoomLevel = Math.max(0.5, Math.min(1.5, zoomLevel + delta));
    document.getElementById('zoom-display').textContent = Math.round(zoomLevel * 100) + '%';
    document.documentElement.style.setProperty('--zoom-scale', zoomLevel);
}
function resetZoom() { zoomLevel = 1.0; adjustZoom(0); }

init();
</script>
</body>
</html>
