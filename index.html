<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TomCat-UI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
          Helvetica, Arial, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #f2f5ff;
        transition: background-color 0.45s ease;
      }
      .card {
        text-align: center;
        padding: 56px 72px;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.85);
        box-shadow: 0 24px 50px rgba(32, 45, 78, 0.18);
        backdrop-filter: blur(12px);
      }
      h1 {
        margin: 0;
        font-size: 3rem;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: #1f2430;
        font-weight: 500;
      }
      h2 {
        margin: 20px 0 40px;
        font-weight: 400;
        color: #5c6474;
      }
      button {
        position: relative;
        padding: 16px 48px;
        font-size: 1.1rem;
        font-weight: 600;
        border: none;
        border-radius: 999px;
        background: linear-gradient(145deg, #6474ff, #7f5bfa);
        color: #fff;
        cursor: pointer;
        box-shadow: 0 18px 40px rgba(113, 101, 242, 0.35);
        transition: transform 0.12s ease, box-shadow 0.2s ease;
      }
      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 22px 48px rgba(113, 101, 242, 0.45);
      }
      button:active {
        transform: scale(0.97);
      }
      button.pulse::after {
        content: "";
        position: absolute;
        inset: -6px;
        border-radius: inherit;
        border: 2px solid rgba(129, 116, 255, 0.45);
        opacity: 0;
        animation: pulse 0.35s ease;
      }
      @keyframes pulse {
        0% {
          transform: scale(0.95);
          opacity: 0.9;
        }
        100% {
          transform: scale(1.1);
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>TomCat-UI</h1>
      <h2>Standby for future updates! In the meantime, here's a button.</h2>
      <button id="color-button" type="button">Click Me</button>
    </main>

    <script>
      const pastelPalette = [
        "#dee6ff",
        "#ffd6e3",
        "#d7f0e6",
        "#ece0ff",
        "#ffe0bd",
        "#d4f1ff",
        "#ffd6ee",
        "#def5d9",
        "#ffe8c7",
      ];

      const body = document.body;
      const button = document.getElementById("color-button");

      function pickNextColor(current) {
        let next = pastelPalette[Math.floor(Math.random() * pastelPalette.length)];
        if (next === current && pastelPalette.length > 1) {
          return pickNextColor(current);
        }
        return next;
      }

      function initBackground() {
        const initial = pastelPalette[0];
        body.style.backgroundColor = initial;
        body.dataset.currentColor = initial;
      }

      button.addEventListener("click", () => {
        const current = body.dataset.currentColor || pastelPalette[0];
        const next = pickNextColor(current);
        body.style.backgroundColor = next;
        body.dataset.currentColor = next;
        button.classList.add("pulse");
        setTimeout(() => button.classList.remove("pulse"), 200);
      });

      document.addEventListener("DOMContentLoaded", initBackground);
    </script>
  </body>
</html>
