<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feeding Schedule | Campus Cat Coalition</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700;900&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            /* --- SITE COLORS --- */
            --site-bg: #FFF9F3;       
            --site-text: #414B3B;     
            --site-accent: #8CA87C;   
            --site-white: #FFFFFF;
            
            /* --- NEW GREEN BACKGROUNDS --- */
            --workspace-bg: #EAF4E8;
            --workspace-grid: #CFE0CC;

            /* --- FUNCTIONAL COLORS --- */
            --grid-line: #E0E5D0;
            --selection-highlight: rgba(140, 168, 124, 0.4); 
            --focus-ring: #414B3B;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--site-bg);
            color: var(--site-text);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- SIDEBAR MENU (GITHUB STYLE) --- */
        .sidebar-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 900;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .sidebar-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .sidebar-menu {
            position: fixed;
            top: 0; left: 0; bottom: 0;
            width: 280px;
            background: white;
            z-index: 1000;
            transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 2px 0 12px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            padding: 20px 0;
        }

        .sidebar-menu.active {
            transform: translateX(0);
        }

        .sidebar-header {
            padding: 0 24px 20px 24px;
            border-bottom: 1px solid var(--grid-line);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-title {
            font-family: 'Merriweather', serif;
            font-weight: 700;
            font-size: 1.2rem;
        }

        .close-menu-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--site-text);
        }

        .sidebar-content {
            padding: 10px 0;
            overflow-y: auto;
        }

        .menu-item {
            display: block;
            padding: 12px 24px;
            text-decoration: none;
            color: var(--site-text);
            font-weight: 500;
            font-size: 0.95rem;
            transition: background 0.1s;
            border-left: 3px solid transparent;
        }

        .menu-item:hover {
            background-color: #f7f9f5;
            border-left-color: var(--site-accent);
        }

        /* --- HEADER & TOOLBAR --- */
        header.site-header {
            background-color: var(--site-bg);
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(65, 75, 59, 0.1);
            flex-shrink: 0;
            z-index: 200;
            position: relative;
        }

        .menu-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .hamburger-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .hamburger-btn span {
            display: block;
            width: 20px;
            height: 2px;
            background-color: var(--site-text);
            border-radius: 2px;
        }

        /* --- TITLE --- */
        h1.page-title {
            margin: 0;
            display: flex;
            align-items: center;
        }

        h1.page-title a {
            font-family: 'Merriweather', serif; /* CLASSIC SERIF FONT */
            font-weight: 900;
            font-size: 1.6rem;
            color: var(--site-text);
            letter-spacing: -0.01em;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        h1.page-title a:hover {
            opacity: 0.7;
        }

        .controls-area {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        /* --- SEARCH BAR --- */
        .search-container {
            position: relative;
            width: 280px;
        }

        input#member-search {
            width: 100%;
            padding: 10px 20px;
            border: 1px solid var(--site-text);
            background: transparent;
            border-radius: 50px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            color: var(--site-text);
            outline: none;
            transition: all 0.2s ease;
        }

        input#member-search:focus {
            background: white;
            box-shadow: 0 4px 12px rgba(65, 75, 59, 0.1);
        }

        input#member-search::placeholder {
            color: var(--site-accent);
            font-weight: 300;
            font-style: italic;
        }

        .search-results {
            position: absolute;
            top: 110%;
            left: 0;
            width: 100%;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(65, 75, 59, 0.15);
            overflow: hidden;
            display: none;
            z-index: 300;
            max-height: 300px;
            overflow-y: auto;
        }

        .result-item {
            padding: 12px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.1s;
        }

        .result-item:hover { background-color: #f7f9f5; }
        .result-name { font-weight: 600; color: var(--site-text); }
        .result-user { font-size: 0.8rem; color: var(--site-accent); }

        /* --- BUTTONS & TOOLS --- */
        .tool-btn {
            background: transparent;
            border: 1px solid var(--site-text);
            color: var(--site-text);
            width: 32px; 
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: all 0.2s;
            padding: 0;
        }

        .tool-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .tool-btn:hover {
            background: var(--site-text);
            color: var(--site-bg);
        }

        #zoom-display {
            font-size: 0.85rem;
            font-weight: 600;
            min-width: 45px;
            text-align: center;
        }

        /* --- SELECTION BADGE --- */
        .current-selection {
            background: var(--site-text);
            color: white;
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 150px;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .current-selection.empty {
            background: rgba(65, 75, 59, 0.1);
            color: var(--site-text);
            box-shadow: none;
        }

        /* --- MAIN WORKSPACE --- */
        .workspace {
            flex: 1;
            overflow: auto;
            padding: 40px;
            display: grid;
            place-items: start center;
            background-color: var(--workspace-bg);
            background-image: radial-gradient(var(--workspace-grid) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .sheet-wrapper {
            background: white;
            padding: 0; /* Remove padding to let legend sit flush if needed, or keep small */
            border-radius: 4px;
            box-shadow: 0 10px 30px -10px rgba(65, 75, 59, 0.2);
            transform-origin: top center;
            transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1);
            display: flex;
            flex-direction: column;
        }

        /* --- CONTROLS LEGEND --- */
        .controls-legend {
            background: #f4f4f4;
            color: #666;
            font-size: 0.75rem;
            padding: 8px 20px;
            border-bottom: 1px solid var(--grid-line);
            display: flex;
            gap: 20px;
            justify-content: center;
            font-family: 'Montserrat', sans-serif;
            font-weight: 500;
            border-radius: 4px 4px 0 0;
        }

        .key-combo {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .key {
            background: white;
            border: 1px solid #ccc;
            border-radius: 3px;
            padding: 2px 5px;
            font-family: monospace;
            font-size: 0.9em;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        table {
            border-collapse: collapse;
            background: white;
            color: var(--site-text);
            user-select: none;
        }

        /* --- TABLE HEADERS --- */
        th {
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            padding: 15px;
            background-color: white;
            border-bottom: 4px solid var(--site-text); 
            box-shadow: 0 4px 6px -2px rgba(0,0,0,0.1);
            color: var(--site-text);
            position: sticky;
            top: 0;
            z-index: 100; 
        }

        th:first-child {
            z-index: 110;
            left: 0;
            background: white;
            border-right: 2px solid var(--site-text);
        }

        /* --- ROW HEADERS (Stations) --- */
        .station-cell {
            font-family: 'Merriweather', serif; /* SAME AS TITLE */
            font-weight: 700;
            font-size: 0.95rem;
            padding: 0 20px;
            text-align: left;
            background-color: #F9FBF7;
            border-bottom: 1px solid var(--grid-line);
            border-right: 2px solid var(--site-text);
            position: sticky;
            left: 0;
            z-index: 50; 
            width: 220px;
        }

        /* --- DATA CELLS --- */
        td.data-cell {
            width: 160px;
            height: 75px; 
            border-bottom: 1px solid var(--grid-line);
            border-right: 1px solid var(--grid-line);
            text-align: center;
            vertical-align: middle;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            position: relative;
            transition: background-color 0.05s;
            padding: 5px;
            line-height: 1.2;
        }

        .cell-name {
            display: block;
            font-weight: 600;
            color: #2b3326;
        }
        
        .cell-user {
            display: block;
            font-size: 0.7rem;
            color: #555;
            margin-top: 2px;
            font-weight: 400;
            opacity: 0.8;
        }

        td.data-cell.focus {
            outline: 2px solid var(--focus-ring);
            outline-offset: -2px;
            z-index: 60;
        }

        td.data-cell.selected {
            background-color: var(--selection-highlight) !important;
        }

        td.data-cell.assigned .cell-name {
            text-shadow: 0 1px 0 rgba(255,255,255,0.4);
        }

        /* Loading Overlay */
        #loading {
            position: fixed; inset: 0;
            background: var(--site-bg);
            z-index: 9999;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            color: var(--site-text); font-family: 'Merriweather', serif;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>

    <div id="loading">
        <div>Loading Schedule...</div>
    </div>

    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleMenu()"></div>
    <div class="sidebar-menu" id="main-menu">
        <div class="sidebar-header">
            <span class="sidebar-title">TomCat</span>
            <button class="close-menu-btn" onclick="toggleMenu()">×</button>
        </div>
        <div class="sidebar-content">
            <a href="#" class="menu-item" onclick="toggleMenu()">Feeding Schedule</a>
            <a href="#" class="menu-item">Volunteer Database</a>
            <a href="#" class="menu-item">Station Management</a>
        </div>
    </div>

    <header class="site-header">
        <div class="menu-container">
            <button class="hamburger-btn" onclick="toggleMenu()" title="Open Menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            
            <h1 class="page-title">
                <a href="https://www.catsofuta.org/">Campus Cat Coalition</a>
            </h1>
        </div>

        <div class="controls-area">
            <button class="tool-btn" onclick="adjustZoom(-0.1)" title="Zoom Out">-</button>
            <div id="zoom-display">100%</div>
            <button class="tool-btn" onclick="adjustZoom(0.1)" title="Zoom In">+</button>
            <button class="tool-btn" onclick="resetZoom()" title="Reset Zoom">
                <svg viewBox="0 0 24 24">
                    <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                </svg>
            </button>

            <div class="search-container">
                <input type="text" id="member-search" placeholder="Search Volunteer..." autocomplete="off">
                <div id="search-results" class="search-results"></div>
            </div>

            <div id="selection-display" class="current-selection empty">
                Select User
            </div>
        </div>
    </header>

    <div class="workspace" id="workspace">
        <div class="sheet-wrapper" id="sheet-container">
            <div class="controls-legend">
                <div class="key-combo"><span class="key">Click</span> Select</div>
                <div class="key-combo"><span class="key">Ctrl</span>+<span class="key">Click</span> Multi-Select</div>
                <div class="key-combo"><span class="key">Shift</span>+<span class="key">Click</span> Range</div>
                <div class="key-combo"><span class="key">Enter</span> Assign</div>
                <div class="key-combo"><span class="key">Del</span> Clear</div>
            </div>

            <table id="schedule-table">
                <thead>
                    <tr>
                        <th>Station</th>
                        <th>Sunday</th>
                        <th>Monday</th>
                        <th>Tuesday</th>
                        <th>Wednesday</th>
                        <th>Thursday</th>
                        <th>Friday</th>
                        <th>Saturday</th>
                    </tr>
                </thead>
                <tbody>
                    </tbody>
            </table>
        </div>
    </div>

<script>
// --- CONFIG ---
const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const STATIONS = [
    "Microwave", "Snickers", "Business", "The Greens", "HOP", 
    "Lot 50", "Mary Kay & Zen", "West Hall", "Maintenance"
];

// --- STATE ---
let scheduleData = {};
let members = [];
let currentVolunteer = null;
let zoomLevel = 1.0;

// Selection
let selectedCells = new Set(); 
let anchor = null; 

// --- INITIALIZATION ---
async function init() {
    STATIONS.forEach(st => {
        scheduleData[st] = new Array(7).fill("");
    });

    renderGrid();
    await fetchMembers();
    document.getElementById('loading').style.display = 'none';
}

// --- API CALL ---
async function fetchMembers() {
    try {
        const urlParams = new URLSearchParams(window.location.search);
        const apiBase = urlParams.get('api');
        const endpoint = apiBase ? `${apiBase.replace(/\/$/, '')}/api/members` : '/api/members';
        
        const res = await fetch(endpoint);
        if (!res.ok) throw new Error("API Failed");
        members = await res.json();
    } catch (e) {
        console.warn("API unavailable, using mock data.");
        members = [
            { name: "Austin B", user: "austin" },
            { name: "Kitadan", user: "kitadan" },
            { name: "Seja", user: ".s3j" },
            { name: "Volunteer 1", user: "v1" },
            { name: "Volunteer 2", user: "v2" },
            { name: "Volunteer 3", user: "v3" }
        ];
    }
}

// --- COLOR GENERATOR (GOLDEN ANGLE DISTRIBUTION) ---
// This ensures that even if names are similar, the colors are vastly different
function getVolunteerColor(name) {
    if (!name) return 'white';
    
    // Hash the name to a large integer
    let hash = 0;
    for (let i = 0; i < name.length; i++) {
        hash = name.charCodeAt(i) + ((hash << 5) - hash);
    }
    
    // Use Golden Angle (137.5 degrees) to distribute hues uniformly
    // We multiply hash by the golden angle approximation
    const goldenAngle = 137.508;
    const hue = Math.abs((hash * goldenAngle) % 360);
    
    // High Saturation for vibrancy, Medium-High Lightness for readability
    return `hsl(${hue}, 80%, 75%)`; 
}

// --- MENU TOGGLE (SIDEBAR) ---
function toggleMenu() {
    const menu = document.getElementById('main-menu');
    const overlay = document.getElementById('sidebar-overlay');
    menu.classList.toggle('active');
    overlay.classList.toggle('active');
}

// --- RENDERING ---
function renderGrid() {
    const tbody = document.querySelector('#schedule-table tbody');
    tbody.innerHTML = '';

    STATIONS.forEach((station, r) => {
        const tr = document.createElement('tr');
        
        const th = document.createElement('td');
        th.className = 'station-cell';
        th.textContent = station;
        tr.appendChild(th);

        scheduleData[station].forEach((val, c) => {
            const td = document.createElement('td');
            td.className = 'data-cell';
            td.dataset.coord = `${r}|${c}`;

            if (val) {
                td.classList.add('assigned');
                td.style.backgroundColor = getVolunteerColor(val);
                
                const member = members.find(m => m.name === val);
                const userHandle = member ? `@${member.user}` : '';

                td.innerHTML = `
                    <span class="cell-name">${val}</span>
                    ${userHandle ? `<span class="cell-user">${userHandle}</span>` : ''}
                `;
            } else {
                td.innerHTML = '';
            }

            if (selectedCells.has(`${r}|${c}`)) {
                td.classList.add('selected');
            }

            td.onmousedown = (e) => handleMouseDown(e, r, c);
            td.onmouseover = (e) => handleMouseOver(e, r, c);

            tr.appendChild(td);
        });
        tbody.appendChild(tr);
    });
}

function updateVisualsOnly() {
    document.querySelectorAll('.data-cell').forEach(td => {
        const coord = td.dataset.coord;
        if (selectedCells.has(coord)) td.classList.add('selected');
        else td.classList.remove('selected');
        
        if (anchor && td.dataset.coord === `${anchor.r}|${anchor.c}`) {
            td.classList.add('focus');
        } else {
            td.classList.remove('focus');
        }
    });
}

// --- INTERACTIONS ---
let isDragging = false;

function handleMouseDown(e, r, c) {
    isDragging = true;
    const coord = `${r}|${c}`;

    if (e.shiftKey && anchor) {
        selectRange(anchor.r, anchor.c, r, c);
    } else if (e.ctrlKey || e.metaKey) {
        if (selectedCells.has(coord)) selectedCells.delete(coord);
        else selectedCells.add(coord);
        anchor = {r, c}; 
    } else {
        selectedCells.clear();
        selectedCells.add(coord);
        anchor = {r, c};
    }
    updateVisualsOnly();
}

function handleMouseOver(e, r, c) {
    if (isDragging && anchor) {
        selectedCells.clear();
        selectRange(anchor.r, anchor.c, r, c);
        updateVisualsOnly();
    }
}

function selectRange(r1, c1, r2, c2) {
    const rMin = Math.min(r1, r2);
    const rMax = Math.max(r1, r2);
    const cMin = Math.min(c1, c2);
    const cMax = Math.max(c1, c2);

    for (let i = rMin; i <= rMax; i++) {
        for (let j = cMin; j <= cMax; j++) {
            selectedCells.add(`${i}|${j}`);
        }
    }
}

document.addEventListener('mouseup', () => isDragging = false);

// --- SEARCH & SELECTION FIX ---
const searchInput = document.getElementById('member-search');
const resultsBox = document.getElementById('search-results');
const selectionBadge = document.getElementById('selection-display');

searchInput.addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    resultsBox.innerHTML = '';
    if (!q) { resultsBox.style.display = 'none'; return; }

    const matches = members.filter(m => 
        m.name.toLowerCase().includes(q) || 
        m.user.toLowerCase().includes(q)
    );

    if (matches.length > 0) {
        resultsBox.style.display = 'block';
        matches.forEach(m => {
            const div = document.createElement('div');
            div.className = 'result-item';
            div.innerHTML = `<span class="result-name">${m.name}</span> <span class="result-user">@${m.user}</span>`;
            div.onmousedown = (ev) => {
                ev.preventDefault(); // Prevent default focus loss logic
                setVolunteer(m);
            };
            resultsBox.appendChild(div);
        });
    } else {
        resultsBox.style.display = 'none';
    }
});

function setVolunteer(m) {
    currentVolunteer = m;
    selectionBadge.className = 'current-selection';
    selectionBadge.style.backgroundColor = getVolunteerColor(m.name);
    selectionBadge.style.color = '#2b3326';
    selectionBadge.textContent = m.name;
    
    // CLEAR UI
    searchInput.value = '';
    resultsBox.style.display = 'none';
    
    // CRITICAL FIX: Blur the input so 'Enter' works for the grid immediately
    searchInput.blur();
}

// --- KEYBOARD ---
document.addEventListener('keydown', (e) => {
    // If typing in search box, let it behave normally (unless it's Enter handled below)
    if (e.target.tagName === 'INPUT' && e.key !== 'Enter') return;

    if (e.key === 'Backspace' || e.key === 'Delete') {
        applyValue("");
    } else if (e.key === 'Enter') {
        if (e.target.tagName === 'INPUT') {
            // If they hit enter in the search box without clicking a result, focus the grid
             e.target.blur();
             return;
        }
        
        if (currentVolunteer) {
            applyValue(currentVolunteer.name);
        } else {
            searchInput.focus();
        }
    } else if (e.key === 'Escape') {
        selectedCells.clear();
        updateVisualsOnly();
    } else if (e.key.startsWith('Arrow')) {
        e.preventDefault();
        if (!anchor) anchor = {r:0, c:0};
        
        let {r, c} = anchor;
        if (e.key === 'ArrowUp') r = Math.max(0, r-1);
        if (e.key === 'ArrowDown') r = Math.min(STATIONS.length-1, r+1);
        if (e.key === 'ArrowLeft') c = Math.max(0, c-1);
        if (e.key === 'ArrowRight') c = Math.min(6, c+1);

        if (e.ctrlKey || e.metaKey) {
            if (e.key === 'ArrowUp') r = 0;
            if (e.key === 'ArrowDown') r = STATIONS.length-1;
            if (e.key === 'ArrowLeft') c = 0;
            if (e.key === 'ArrowRight') c = 6;
        }

        anchor = {r, c};

        if (e.shiftKey) {
             selectedCells.add(`${r}|${c}`); 
        } else {
            selectedCells.clear();
            selectedCells.add(`${r}|${c}`);
        }
        
        const cell = document.querySelector(`.data-cell[data-coord="${r}|${c}"]`);
        cell?.scrollIntoView({block: 'nearest', inline: 'nearest'});
        
        updateVisualsOnly();
    }
});

function applyValue(val) {
    if (selectedCells.size === 0) return;
    
    selectedCells.forEach(coord => {
        const [r, c] = coord.split('|').map(Number);
        scheduleData[STATIONS[r]][c] = val;
    });
    renderGrid();
}

// --- ZOOM ---
function adjustZoom(delta) {
    zoomLevel = Math.max(0.5, Math.min(1.5, zoomLevel + delta));
    applyZoom();
}
function resetZoom() {
    const containerW = document.getElementById('workspace').clientWidth;
    const tableW = document.getElementById('schedule-table').offsetWidth;
    zoomLevel = Math.min(1.0, (containerW - 60) / tableW);
    applyZoom();
}
function applyZoom() {
    document.getElementById('zoom-display').textContent = Math.round(zoomLevel * 100) + '%';
    document.getElementById('sheet-container').style.transform = `scale(${zoomLevel})`;
}

// Run
init();

</script>
</body>
</html>
