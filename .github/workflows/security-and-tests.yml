name: Security and tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-test.txt

      - name: Compile Python
        run: python -m compileall -q tomcat UserInterface scripts cloud

      - name: Run Python regression scripts
        run: |
          python scripts/test_web_security.py
          python scripts/test_finance_dedup.py
          python scripts/test_dues_name_match.py
          python scripts/test_income_category.py
          python scripts/test_spam_false_positives.py
          python scripts/test_pending_dues.py
          python scripts/test_log_retention.py
          python scripts/test_labeler_hot_paths.py

      - name: Run JavaScript regression scripts
        run: |
          node scripts/test_labeler_api.js
          node scripts/test_labeler_save_queue.js
          node scripts/test_ui_security.js
